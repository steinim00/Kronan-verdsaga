<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Price Changes — Kronan</title>
<link rel="icon" type="image/png" href="assets/kronan-emblem.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #ffffff;
    --paper-edge: #f0f0f0;
    --ink: #2a2822;
    --ink-faint: #8a8a86;
    --up: #e53935;
    --down: #43a047;
    --rule: #e2e2e2;
    --star: #b8912f;
    --brand: #FFE800;
    --backdrop: #ececea;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--backdrop);
    background-image:
      radial-gradient(circle at 20% 20%, rgba(0,0,0,0.03), transparent 60%),
      radial-gradient(circle at 80% 80%, rgba(0,0,0,0.03), transparent 60%);
    font-family: "Gill Sans", "Gill Sans MT", "Trebuchet MS", sans-serif;
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 16px 96px;
    gap: 20px;
  }

  .toolbar {
    width: 100%;
    max-width: 460px;
    position: relative;
  }

  .page {
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .page-main, .page-sidebar {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .search-input {
    width: 100%;
    font-family: inherit;
    font-size: 13px;
    padding: 10px 12px;
    border: 1px solid var(--rule);
    background: var(--paper);
    color: var(--ink);
  }
  .search-input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand); }
  .search-input::placeholder { color: var(--ink-faint); }

  .search-results {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    background: var(--paper);
    border: 1px solid var(--rule);
    max-height: 280px;
    overflow-y: auto;
    z-index: 20;
    box-shadow: 0 12px 24px -12px rgba(0,0,0,0.35);
  }
  .search-results:empty { display: none; }

  .search-result {
    padding: 8px 12px;
    font-size: 12px;
    border-bottom: 1px dotted var(--rule);
    cursor: pointer;
  }
  .search-result:hover { background: var(--paper-edge); }
  .search-result .sr-name { font-weight: 500; }
  .search-result .sr-meta { color: var(--ink-faint); font-size: 10px; }

  .shrink-alert {
    background: #fdecea;
    border: 1px solid #e53935;
    border-left: 5px solid #e53935;
    color: #8b1a15;
    padding: 12px 14px;
    margin-bottom: 16px;
    font-size: 12px;
    line-height: 1.6;
    border-radius: 4px;
  }
  .shrink-alert strong { display: block; font-size: 13px; margin-bottom: 4px; color: #b71c1c; }
  .shrink-alert ul { margin: 4px 0 0; padding-left: 18px; }
  .shrink-alert li { margin-bottom: 2px; }

  .receipt {
    width: 100%;
    max-width: 460px;
    background: var(--paper);
    box-shadow: 0 20px 40px -20px rgba(0,0,0,0.35);
    padding: 32px 28px 40px;
    border-top: 4px solid var(--brand);
    position: relative;
  }

  .receipt::before,
  .receipt::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    height: 14px;
    background:
      linear-gradient(135deg, var(--paper) 25%, transparent 25%) 0 0,
      linear-gradient(225deg, var(--paper) 25%, transparent 25%) 0 0;
    background-size: 16px 16px;
    background-color: transparent;
  }
  .receipt::before { top: -13px; background-color: var(--backdrop); }
  .receipt::after { bottom: -13px; transform: scaleY(-1); background-color: var(--backdrop); }

  header { margin-bottom: 20px; }
  .header-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .header-cpi {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px dashed var(--rule);
    font-size: 12px;
    color: var(--ink-faint);
  }
  .header-cpi-item { display: flex; align-items: baseline; gap: 5px; white-space: nowrap; }
  .header-cpi-divider { width: 1px; align-self: stretch; background: var(--rule); }
  .header-cpi-label { text-transform: uppercase; font-size: 10px; letter-spacing: 0.04em; }
  .header-cpi-val { font-weight: 700; font-family: "JetBrains Mono", monospace; }
  .header-cpi-val.up { color: var(--up); }
  .header-cpi-val.down { color: var(--down); }
  .lang-switch {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    border: 1px solid var(--rule);
    border-radius: 999px;
    width: 26px;
    height: 26px;
    overflow: hidden;
    filter: grayscale(40%);
    opacity: 0.85;
  }
  .lang-switch:hover { filter: none; opacity: 1; }
  .lang-switch svg { width: 100%; height: 100%; display: block; }

  .header-date {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: flex-end;
    text-align: right;
    font-size: 11px;
    color: var(--ink-faint);
  }

  .store-badge { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
  .store-logo { height: 34px; width: auto; display: block; }

  .subtitle {
    margin-top: 4px;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  .date-picker { position: relative; }

  .date-picker-toggle {
    font-family: inherit;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    background: none;
    border: 1px solid var(--rule);
    border-radius: 999px;
    color: var(--ink-faint);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 6px 14px;
  }
  .date-picker-toggle:hover { color: var(--ink); }
  .date-picker-toggle .caret { font-size: 9px; }

  .date-picker-panel {
    position: absolute;
    top: calc(100% + 10px);
    right: 0;
    z-index: 20;
    width: min(420px, 90vw);
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 8px;
    box-shadow: 0 10px 28px rgba(0,0,0,0.18);
    padding: 22px;
  }
  .date-picker-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    font-size: 18px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .date-picker-nav button {
    background: none;
    border: none;
    font-family: inherit;
    font-size: 26px;
    color: var(--ink);
    cursor: pointer;
    padding: 2px 14px;
    line-height: 1;
  }
  .date-picker-nav button:disabled { color: var(--ink-faint); opacity: 0.3; cursor: default; }
  .date-picker-weekdays, .date-picker-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .date-picker-weekdays span {
    font-size: 14px;
    text-align: center;
    color: var(--ink-faint);
    padding-bottom: 8px;
  }
  .date-picker-grid button {
    font-family: inherit;
    font-size: 16px;
    background: none;
    border: none;
    border-radius: 6px;
    aspect-ratio: 1;
    cursor: pointer;
    color: var(--ink-faint);
  }
  .date-picker-grid button.has-data { color: var(--ink); cursor: pointer; }
  .date-picker-grid button:disabled { opacity: 0.3; cursor: default; }
  .date-picker-grid button.has-data:hover { background: rgba(0,0,0,0.07); }
  .date-picker-grid button.selected { background: var(--brand); color: var(--ink); font-weight: 700; }
  .date-picker-grid .empty-cell { visibility: hidden; }

  .section-label {
    margin: 22px 0 10px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-label.up { color: var(--up); }
  .section-label.down { color: var(--down); }
  .section-label::after { content: ""; flex: 1; border-top: 1px dashed var(--rule); }

  .line {
    display: grid;
    grid-template-columns: 20px 1fr auto;
    gap: 2px 10px;
    padding: 8px 0;
    border-bottom: 1px dotted var(--rule);
    font-size: 13px;
    cursor: pointer;
  }
  .line-icon { grid-row: span 2; align-self: center; }
  .line-icon svg { display: block; }
  .line-icon:empty { width: 20px; }
  .line:last-child { border-bottom: none; }
  .line:hover .name { text-decoration: underline; }

  .line .name { font-weight: 500; line-height: 1.3; }
  .line .badge {
    font-size: 9px;
    color: var(--star);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-left: 6px;
  }
  .line .meta { grid-column: 1; font-size: 10px; color: var(--ink-faint); }
  .line .prices { grid-column: 2; text-align: right; font-size: 10px; color: var(--ink-faint); }
  .line .percent { grid-column: 2; text-align: right; font-weight: 700; font-size: 15px; }
  .line.up .percent::before { content: "▲ "; }
  .line.down .percent::before { content: "▼ "; }
  .line.up .percent { color: var(--up); }
  .line.down .percent { color: var(--down); }

  .empty { font-size: 12px; color: var(--ink-faint); padding: 8px 0; font-style: italic; }

  .view-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .view-tab {
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    padding: 4px 2px 8px;
    color: var(--ink-faint);
    cursor: pointer;
  }
  .view-tab:hover { color: var(--ink); }
  .view-tab.active { color: var(--ink); border-bottom-color: var(--brand); }

  .range-tabs {
    display: flex;
    gap: 6px;
    margin-top: 16px;
    margin-bottom: 16px;
  }
  .range-tab {
    font-family: inherit;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    background: none;
    border: 1px solid var(--rule);
    border-radius: 999px;
    padding: 6px 14px;
    color: var(--ink-faint);
    cursor: pointer;
  }
  .range-tab:hover { color: var(--ink); }
  .range-tab.active { background: var(--brand); color: var(--ink); border-color: var(--brand); }

  .sort-tabs { display: flex; gap: 10px; margin-bottom: 14px; }
  .sort-tab {
    font-family: inherit;
    font-size: 10px;
    background: none;
    border: none;
    padding: 0;
    color: var(--ink-faint);
    text-decoration: underline;
    cursor: pointer;
  }
  .sort-tab.active { color: var(--ink); font-weight: 700; text-decoration: none; }

  .see-more-btn {
    display: block;
    width: 100%;
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    background: none;
    border: none;
    border-top: 1px dashed var(--rule);
    border-bottom: 1px dashed var(--rule);
    color: var(--ink-faint);
    padding: 10px 0;
    margin: 4px 0 20px;
    cursor: pointer;
    text-align: center;
  }
  .see-more-btn:hover { color: var(--ink); }

  .col-up, .col-down {
    padding: 6px 10px;
    margin: 0 -10px;
    border-radius: 6px;
  }
  .col-up { background: rgba(229, 57, 53, 0.06); }
  .col-down { background: rgba(67, 160, 71, 0.06); }
  .col-up .line { border-bottom-color: rgba(229, 57, 53, 0.15); }
  .col-down .line { border-bottom-color: rgba(67, 160, 71, 0.15); }
  .col-up .name, .col-up .meta, .col-up .prices { color: var(--up); }
  .col-down .name, .col-down .meta, .col-down .prices { color: var(--down); }
  .col-up .meta, .col-up .prices { opacity: 0.75; }
  .col-down .meta, .col-down .prices { opacity: 0.75; }
  .col-up .cat-link:hover, .col-down .cat-link:hover { opacity: 1; text-decoration-style: solid; }

  .cpi-index {
    font-size: 32px;
    font-weight: 700;
    line-height: 1.1;
    margin-top: 4px;
  }
  .cpi-index-unit {
    font-size: 12px;
    font-weight: 400;
    color: var(--ink-faint);
    margin-left: 6px;
  }
  .cpi-month { font-size: 11px; color: var(--ink-faint); margin-top: 2px; }
  .cpi-rows { margin-top: 14px; display: flex; flex-direction: column; gap: 6px; }
  .cpi-row {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    padding-top: 6px;
    border-top: 1px dotted var(--rule);
  }
  .cpi-row span:first-child { color: var(--ink-faint); }
  .cpi-row span:last-child.up { color: var(--up); font-weight: 700; }
  .cpi-row span:last-child.down { color: var(--down); font-weight: 700; }

  .anova-box {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--rule);
    font-size: 11px;
    line-height: 1.5;
    color: var(--ink-faint);
  }
  .anova-box strong { color: var(--ink); }
  .anova-more-btn {
    display: block;
    margin-top: 6px;
    font-family: inherit;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    background: none;
    border: none;
    color: var(--ink-faint);
    text-decoration: underline;
    cursor: pointer;
    padding: 0;
  }
  .anova-more-btn:hover { color: var(--ink); }
  .anova-detail { margin-top: 8px; }
  .stats-view, .stats-view .anova-table, .stats-view .anova-box, .stats-view .anova-more-btn {
    font-family: "Gill Sans", "Gill Sans MT", Calibri, "Trebuchet MS", sans-serif;
  }

  .anova-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 10px;
    font-family: "JetBrains Mono", monospace;
  }
  .anova-table th, .anova-table td {
    text-align: left;
    padding: 3px 6px 3px 0;
    border-bottom: 1px dotted var(--rule);
  }
  .anova-table th { color: var(--ink-faint); font-weight: 600; text-transform: uppercase; font-size: 9px; }
  .anova-table td:last-child, .anova-table th:last-child { text-align: right; }

  .category-row {
    display: grid;
    grid-template-columns: 1fr 32px 32px;
    align-items: baseline;
    gap: 4px;
    font-size: 12px;
    padding: 7px 0;
    border-bottom: 1px dotted var(--rule);
  }
  .category-row:last-child { border-bottom: none; }
  .category-row .category-name { color: var(--ink); }
  .category-row .category-count { white-space: nowrap; font-size: 11px; font-weight: 700; text-align: right; }
  .category-row .category-count.up { color: var(--up); }
  .category-row .category-count.down { color: var(--down); }

  .category-link, .cat-link {
    cursor: pointer;
    text-decoration: underline dotted;
    text-underline-offset: 2px;
  }
  .category-link:hover, .cat-link:hover { color: var(--ink); text-decoration-style: solid; }

  footer {
    margin-top: 26px;
    padding-top: 14px;
    border-top: 1px dashed var(--rule);
    text-align: center;
    font-size: 10px;
    color: var(--ink-faint);
    letter-spacing: 0.08em;
  }

  .status { text-align: center; padding: 40px 0; font-size: 13px; color: var(--ink-faint); }

  /* Favorites */
  .fav-line { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px dotted var(--rule); font-size: 13px; }
  .fav-line .name { cursor: pointer; }
  .fav-line .name:hover { text-decoration: underline; }
  .fav-star-btn { background: none; border: none; cursor: pointer; font-size: 15px; color: var(--star); }

  /* Product detail modal */
  .modal-backdrop {
    display: none;
    position: fixed; inset: 0;
    background: rgba(20,18,14,0.55);
    z-index: 50;
    align-items: flex-start;
    justify-content: center;
    padding: 48px 16px;
    overflow-y: auto;
  }
  .modal-backdrop.open { display: flex; }

  .modal {
    background: var(--paper);
    max-width: 420px;
    width: 100%;
    padding: 24px;
    position: relative;
  }
  .modal-close {
    position: absolute; top: 10px; right: 14px;
    background: none; border: none; font-size: 18px; cursor: pointer; color: var(--ink-faint);
  }
  .modal h2 { font-family: "Fraunces", serif; font-size: 20px; margin: 0 0 2px; padding-right: 20px; }
  .modal .modal-meta { font-size: 11px; color: var(--ink-faint); margin-bottom: 14px; }
  .modal .modal-price { font-size: 24px; font-weight: 700; margin: 10px 0; }
  .modal .modal-price.up { color: var(--up); }
  .modal .modal-price.down { color: var(--down); }
  .modal .modal-badges { display: flex; gap: 8px; margin-bottom: 10px; }
  .modal .badge-tag {
    font-size: 9px; text-transform: uppercase; letter-spacing: 0.05em;
    border: 1px solid var(--star); color: var(--star); padding: 2px 6px;
  }
  .modal svg { width: 100%; height: 120px; margin: 12px 0; display: block; }

  .spark-wrap { position: relative; }
  .spark-dot { fill: var(--ink-faint); }
  .spark-hit { cursor: crosshair; }
  .spark-tooltip {
    display: none;
    position: absolute;
    transform: translate(-50%, -130%);
    background: var(--ink);
    color: var(--paper);
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    line-height: 1.4;
    padding: 5px 8px;
    border-radius: 5px;
    white-space: nowrap;
    pointer-events: none;
    z-index: 5;
  }
  .spark-tooltip::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 100%;
    transform: translateX(-50%);
    border: 4px solid transparent;
    border-top-color: var(--ink);
  }
  .fav-toggle {
    font-family: inherit; font-size: 12px; padding: 8px 14px;
    border: 1px solid var(--star); background: transparent; color: var(--star);
    cursor: pointer; margin-top: 8px;
  }
  .fav-toggle.active { background: var(--star); color: var(--paper); }

  /* ---------- Desktop layout ---------- */
  .two-col-grid { display: block; }

  @media (min-width: 860px) {
    .page {
      max-width: 1040px;
      display: grid;
      grid-template-columns: 1fr 300px;
      align-items: start;
      gap: 32px;
    }
    .page-main { max-width: none; }
    .page-sidebar { position: sticky; top: 32px; }
    .page-sidebar .toolbar,
    .page-main .receipt {
      max-width: none;
    }
    .receipt { padding: 36px 44px 44px; }

    .two-col-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: 40px;
    }
    .two-col-grid > section:first-child { grid-column: 1; }
    .two-col-grid > section:last-child { grid-column: 2; }
  }

  /* Extra-wide: two movers going the same direction can sit side by side */
  @media (min-width: 1300px) {
    .page { max-width: 1360px; }
    .movers-visible, .movers-extra {
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: 20px;
    }
    .movers-extra[hidden] { display: none; }
  }
</style>
</head>
<body>

  <div class="page">
    <div class="page-main">
      <div class="receipt">
        <div class="shrink-alert" id="shrinkAlert" hidden></div>

        <header>
          <div class="header-top">
            <div>
              <div class="store-badge">
                <img src="assets/kronan-logo.png" alt="Krónan" class="store-logo">
                <div class="subtitle">Today's price changes</div>
              </div>
            </div>
            <div class="header-date">
              <a href="index.html" class="lang-switch" aria-label="Íslenska" title="Íslenska">
                <svg viewBox="0 0 25 18" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
                  <clipPath id="isclip"><rect width="25" height="18" rx="2"/></clipPath>
                  <g clip-path="url(#isclip)">
                    <rect width="25" height="18" fill="#02529C"/>
                    <rect x="7" width="4" height="18" fill="#fff"/>
                    <rect y="7" width="25" height="4" fill="#fff"/>
                    <rect x="8" width="2" height="18" fill="#DC1E35"/>
                    <rect y="8" width="25" height="2" fill="#DC1E35"/>
                  </g>
                </svg>
              </a>
              <span id="dateLabel">—</span>
              <div class="date-picker" id="datePicker">
                <button type="button" class="date-picker-toggle" id="dateToggle" aria-haspopup="true" aria-expanded="false">
                  Calendar <span class="caret">▾</span>
                </button>
                <div class="date-picker-panel" id="datePanel" hidden>
                  <div class="date-picker-nav">
                    <button type="button" id="prevMonthBtn" aria-label="Previous month">‹</button>
                    <span id="monthLabel"></span>
                    <button type="button" id="nextMonthBtn" aria-label="Next month">›</button>
                  </div>
                  <div class="date-picker-weekdays">
                    <span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span>
                  </div>
                  <div class="date-picker-grid" id="dateGrid"></div>
                </div>
              </div>
            </div>
          </div>
          <div class="header-cpi" id="headerCpi" style="display:none;"></div>
        </header>

        <div class="view-tabs" id="viewTabs">
          <button type="button" class="view-tab active" data-view="overview">Overview</button>
          <button type="button" class="view-tab" data-view="extremes">Price extremes</button>
          <button type="button" class="view-tab" data-view="stats">Statistics</button>
        </div>

        <div class="range-tabs" id="rangeTabs">
          <button type="button" class="range-tab active" data-range="daily">Last 24 hours</button>
          <button type="button" class="range-tab" data-range="weekly">Last week</button>
        </div>
        <div class="sort-tabs" id="sortTabs">
          <button type="button" class="sort-tab active" data-sort="percent">Sort by %</button>
          <button type="button" class="sort-tab" data-sort="amount">Sort by ISK</button>
        </div>

        <div id="content"><div class="status">Loading data…</div></div>

        <footer>most product codes · daily snapshot</footer>
      </div>
    </div>

    <div class="page-sidebar">
      <div class="toolbar">
        <input class="search-input" id="searchInput" placeholder="Search for a product…" autocomplete="off" />
        <div class="search-results" id="searchResults"></div>
      </div>

      <div class="receipt" id="categoriesCard" style="display:none;">
        <div class="section-label">Categories today</div>
        <div id="categoriesContent"></div>
      </div>

      <div class="receipt" id="favoritesCard" style="display:none;">
        <div class="section-label">★ My products</div>
        <div id="favoritesContent"></div>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <button class="modal-close" id="modalClose">✕</button>
      <div id="modalContent"></div>
    </div>
  </div>

<script>
  const contentEl = document.getElementById("content");
  const dateLabelEl = document.getElementById("dateLabel");
  const dateSelectEl = {
    el: document.getElementById("datePicker"),
    toggle: document.getElementById("dateToggle"),
    panel: document.getElementById("datePanel"),
    grid: document.getElementById("dateGrid"),
    monthLabel: document.getElementById("monthLabel"),
    prevBtn: document.getElementById("prevMonthBtn"),
    nextBtn: document.getElementById("nextMonthBtn"),
  };
  const searchInputEl = document.getElementById("searchInput");
  const searchResultsEl = document.getElementById("searchResults");
  const modalBackdrop = document.getElementById("modalBackdrop");
  const modalContent = document.getElementById("modalContent");
  const favoritesCard = document.getElementById("favoritesCard");
  const favoritesContent = document.getElementById("favoritesContent");

  let currentMovers = null;
  let productIndex = null; // loaded lazily on first search

  // ---------- formatting ----------
  function fmtISK(n) {
    return new Intl.NumberFormat("en-US").format(n) + " kr";
  }
  // Shows the unit next to the price when it's not a plain per-item price
  // (e.g. "1.598 kr/kg" for weight-priced goods, just "399 kr" for stk).
  function fmtISKUnit(n, unit) {
    const base = new Intl.NumberFormat("en-US").format(n) + " kr";
    if (!unit || unit.toLowerCase() === "stk") return base;
    return base + "/" + unit;
  }
  function fmtPercent(n) {
    const formatted = new Intl.NumberFormat("en-US", { maximumFractionDigits: 2 }).format(Math.abs(n));
    return (n > 0 ? "+" : n < 0 ? "-" : "") + formatted + "%";
  }
  function fmtAmount(n, unit) {
    const formatted = new Intl.NumberFormat("en-US").format(Math.abs(Math.round(n)));
    const sign = n > 0 ? "+" : n < 0 ? "-" : "";
    const suffix = unit && unit.toLowerCase() !== "stk" ? "/" + unit : "";
    return `${sign}${formatted} kr${suffix}`;
  }

  // ---------- favorites (localStorage) ----------
  const FAV_KEY = "kronan-verdsaga-favorites";
  function getFavorites() {
    try { return JSON.parse(localStorage.getItem(FAV_KEY)) || []; } catch { return []; }
  }
  function setFavorites(list) {
    localStorage.setItem(FAV_KEY, JSON.stringify(list));
  }
  function isFavorite(sku) {
    return getFavorites().some((f) => f.sku === sku);
  }
  function toggleFavorite(sku, name, brand) {
    const list = getFavorites();
    const idx = list.findIndex((f) => f.sku === sku);
    if (idx >= 0) list.splice(idx, 1);
    else list.push({ sku, name, brand });
    setFavorites(list);
    renderFavorites();
  }

  async function renderFavorites() {
    const favs = getFavorites();
    if (favs.length === 0) { favoritesCard.style.display = "none"; return; }
    favoritesCard.style.display = "";
    favoritesContent.innerHTML = '<div class="status" style="padding:12px 0;">Fetching prices…</div>';

    const rows = await Promise.all(favs.map(async (f) => {
      const hist = await fetchHistory(f.sku);
      const last = hist.h[hist.h.length - 1];
      const prev = hist.h[hist.h.length - 2];
      const price = last ? last[1] : null;
      let trend = "";
      if (last && prev && prev[1]) {
        const pct = ((last[1] - prev[1]) / prev[1]) * 100;
        if (pct > 0) trend = `<span style="color:var(--up)">▲ ${fmtPercent(pct)}</span>`;
        else if (pct < 0) trend = `<span style="color:var(--down)">▼ ${fmtPercent(pct)}</span>`;
      }
      return `
        <div class="fav-line">
          <span class="name" data-sku="${f.sku}" data-name="${f.name}" data-brand="${f.brand || ""}">${f.name}</span>
          <span>${price != null ? fmtISK(price) : "—"} ${trend}</span>
        </div>
      `;
    }));
    favoritesContent.innerHTML = rows.join("");
    favoritesContent.querySelectorAll(".name[data-sku]").forEach((el) => {
      el.addEventListener("click", () => openProduct(el.dataset.sku, el.dataset.name, el.dataset.brand));
    });
  }

  // ---------- data fetching ----------
  async function fetchHistory(sku) {
    try {
      const res = await fetch(`data/history/${sku}.json`);
      if (!res.ok) return { h: [] };
      return res.json();
    } catch {
      return { h: [] };
    }
  }

  async function ensureIndexLoaded() {
    if (productIndex) return productIndex;
    const res = await fetch("data/products-index.json");
    productIndex = res.ok ? await res.json() : [];
    return productIndex;
  }

  // ---------- search ----------
  let searchDebounce;
  searchInputEl.addEventListener("input", () => {
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(runSearch, 150);
  });

  async function runSearch() {
    const q = searchInputEl.value.trim().toLowerCase();

    if (q.length < 2) { searchResultsEl.innerHTML = ""; return; }

    const index = await ensureIndexLoaded();
    let matches = index.filter((p) =>
      p.name.toLowerCase().includes(q) || p.sku.includes(q) || (p.brand && p.brand.toLowerCase().includes(q))
    ).slice(0, 20);

    if (matches.length === 0) {
      searchResultsEl.innerHTML = '<div class="search-result">No results</div>';
      return;
    }
    searchResultsEl.innerHTML = matches.map((p) => `
      <div class="search-result" data-sku="${p.sku}" data-name="${p.name.replace(/"/g, '&quot;')}" data-brand="${(p.brand||"").replace(/"/g, '&quot;')}" data-category="${(p.categoryPath ? p.categoryPath.split("/")[0].trim() : "").replace(/"/g, '&quot;')}">
        <div class="sr-name">${p.name}</div>
        <div class="sr-meta">${[p.categoryPath ? p.categoryPath.split("/")[0].trim() : null, p.brand].filter(Boolean).join(" · ")}</div>
      </div>
    `).join("");
    searchResultsEl.querySelectorAll(".search-result[data-sku]").forEach((el) => {
      el.addEventListener("click", () => {
        openProduct(el.dataset.sku, el.dataset.name, el.dataset.brand, el.dataset.category);
        searchResultsEl.innerHTML = "";
        searchInputEl.value = "";
      });
    });
  }

  document.addEventListener("click", (e) => {
    if (!e.target.closest(".toolbar")) searchResultsEl.innerHTML = "";
  });

  // ---------- product detail modal ----------
  function fmtDateLong(dateStr) {
    const DAY_NAMES = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
    const [y, m, d] = dateStr.split("-").map(Number);
    const date = new Date(y, m - 1, d);
    const dayName = DAY_NAMES[date.getDay()];
    const monthName = MONTH_NAMES[m - 1];
    return `${dayName}, ${monthName} ${d}`;
  }

  function fmtDateShort(dateStr) {
    const [y, m, d] = dateStr.split("-").map(Number);
    return `${MONTH_NAMES[m - 1]} ${d}`;
  }

  function sparklineSvg(points) {
    if (points.length < 2) {
      return '<div class="empty">Not enough data for a chart yet</div>';
    }
    const w = 380, h = 110, pad = 6;
    const prices = points.map((p) => p[1]);
    const min = Math.min(...prices), max = Math.max(...prices);
    const range = max - min || 1;
    const step = (w - pad * 2) / (points.length - 1);

    const coords = points.map((p, i) => {
      const x = pad + i * step;
      const y = h - pad - ((p[1] - min) / range) * (h - pad * 2);
      return [x, y];
    });
    const path = coords.map(([x, y], i) => (i === 0 ? `M${x},${y}` : `L${x},${y}`)).join(" ");
    const last = coords[coords.length - 1];

    const dots = coords.map(([x, y], i) => `<circle class="spark-dot" cx="${x}" cy="${y}" r="2.5" />`).join("");
    const hitAreas = coords.map(([x, y], i) => `
      <circle class="spark-hit" cx="${x}" cy="${y}" r="10" fill="transparent"
        data-date="${points[i][0]}" data-price="${points[i][1]}" data-x="${x}" data-y="${y}" />
    `).join("");

    return `
      <div class="spark-wrap">
        <svg viewBox="0 0 ${w} ${h}" style="height:${h}px;" preserveAspectRatio="none">
          <path d="${path}" fill="none" stroke="#2a2822" stroke-width="2" />
          ${dots}
          <circle cx="${last[0]}" cy="${last[1]}" r="3" fill="#e53935" />
          ${hitAreas}
        </svg>
        <div class="spark-tooltip" id="sparkTooltip"></div>
      </div>
      <div style="display:flex; justify-content:space-between; font-size:10px; color:var(--ink-faint);">
        <span>${fmtDateShort(points[0][0])}</span>
        <span>${fmtDateShort(points[points.length - 1][0])}</span>
      </div>
    `;
  }

  function wireSparklineHover(root, valueFormatter) {
    const fmt = valueFormatter || fmtISK;
    const wrap = root.querySelector(".spark-wrap");
    const tooltip = root.querySelector("#sparkTooltip");
    if (!wrap || !tooltip) return;
    const w = 380, h = 110;

    wrap.querySelectorAll(".spark-hit").forEach((hit) => {
      hit.addEventListener("mouseenter", () => showTip(hit));
      hit.addEventListener("touchstart", (e) => { e.preventDefault(); showTip(hit); }, { passive: false });
    });
    wrap.addEventListener("mouseleave", () => { tooltip.style.display = "none"; });

    function showTip(hit) {
      const x = Number(hit.dataset.x), y = Number(hit.dataset.y);
      const date = hit.dataset.date, price = Number(hit.dataset.price);
      tooltip.innerHTML = `<strong>${fmt(price)}</strong><br>${fmtDateShort(date)}`;
      tooltip.style.left = `${(x / w) * 100}%`;
      tooltip.style.top = `${(y / h) * 100}%`;
      tooltip.style.display = "block";
    }
  }

  async function openProduct(sku, name, brand, category) {
    modalBackdrop.classList.add("open");
    modalContent.innerHTML = '<div class="status">Fetching price history…</div>';

    const hist = await fetchHistory(sku);
    const points = hist.h; // [[date, price, pricePerKiloOrNull], ...]
    const prices = points.map((p) => p[1]);
    const currentPrice = prices[prices.length - 1];
    const low = prices.length ? Math.min(...prices) : null;
    const high = prices.length ? Math.max(...prices) : null;

    const fav = isFavorite(sku);
    const categoryHtml = category ? await categoryIndexSummaryHtml(category) : "";

    modalContent.innerHTML = `
      <h2>${name}</h2>
      <div class="modal-meta">${sku}${brand ? " · " + brand : ""}</div>
      <div class="modal-price">${currentPrice != null ? fmtISK(currentPrice) : "—"}</div>
      <div class="modal-badges">
        ${currentPrice != null && currentPrice === low ? '<span class="badge-tag">Lowest price seen so far</span>' : ""}
        ${currentPrice != null && currentPrice === high && low !== high ? '<span class="badge-tag">Highest price seen so far</span>' : ""}
      </div>
      ${sparklineSvg(points)}
      <button class="fav-toggle ${fav ? "active" : ""}" id="favToggleBtn">
        ${fav ? "★ In favorites — remove" : "☆ Add to favorites"}
      </button>
      ${categoryHtml}
    `;
    document.getElementById("favToggleBtn").addEventListener("click", () => {
      toggleFavorite(sku, name, brand);
      openProduct(sku, name, brand, category); // re-render to flip button state
    });
    wireSparklineHover(modalContent);
    modalContent.querySelectorAll(".cat-link").forEach((el) => {
      el.addEventListener("click", () => openCategory(el.dataset.category));
    });
  }

  async function categoryIndexSummaryHtml(category) {
    const trends = await ensureCategoryTrendsLoaded();
    const points = trends[category] || [];
    const values = points.map((p) => p[1]);
    const current = values.length ? values[values.length - 1] : null;
    const base = values.length ? values[0] : null;
    const changeFromStart = base ? Math.round(((current - base) / base) * 1000) / 10 : null;

    const subs = await ensureCategorySubindicesLoaded();
    const hagstofaLine = subs[category]
      ? ` · Statistics Iceland: ${fmtCpiPercent(subs[category].yearChangePercent)} YoY`
      : "";

    return `
      <div class="anova-box" style="margin-top:16px;">
        <strong>Category <span class="cat-link" data-category="${category.replace(/"/g,'&quot;')}">${category}</span>:</strong><br>
        ${changeFromStart != null ? `${changeFromStart > 0 ? "+" : ""}${fmtIndex(changeFromStart)}% since start` : "no data yet"}${hagstofaLine}
      </div>
    `;
  }

  // ---------- category trend modal ----------
  let categoryTrends = null;
  async function ensureCategoryTrendsLoaded() {
    if (categoryTrends) return categoryTrends;
    try {
      const res = await fetch("data/category-trends.json");
      categoryTrends = res.ok ? await res.json() : {};
    } catch {
      categoryTrends = {};
    }
    return categoryTrends;
  }

  function fmtIndex(n) {
    return new Intl.NumberFormat("en-US", { maximumFractionDigits: 1 }).format(n);
  }

  async function openCategory(name) {
    modalBackdrop.classList.add("open");
    modalContent.innerHTML = '<div class="status">Fetching category price trend…</div>';

    const trends = await ensureCategoryTrendsLoaded();
    const points = trends[name] || [];
    const values = points.map((p) => p[1]);
    const current = values.length ? values[values.length - 1] : null;
    const base = values.length ? values[0] : null;
    const changeFromStart = base ? Math.round(((current - base) / base) * 1000) / 10 : null;

    // Filter products from current movers by category
    const categoryIncreases = currentMovers ? (currentRange === "weekly" ? currentMovers.weekly.topIncreasesByAmount : currentMovers.topIncreasesByAmount)
      .filter((it) => it.category === name) : [];
    const categoryDecreases = currentMovers ? (currentRange === "weekly" ? currentMovers.weekly.topDecreasesByAmount : currentMovers.topDecreasesByAmount)
      .filter((it) => it.category === name) : [];

    const productsHtml = categoryIncreases.length || categoryDecreases.length
      ? `
        <div style="margin-top:20px;">
          <div style="font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-faint); margin-bottom:8px;">Products that changed</div>
          ${categoryIncreases.length ? `
            <div style="margin-bottom:16px;">
              <div style="font-size:11px; color:var(--up); font-weight:700; margin-bottom:6px;">▲ Increased (${categoryIncreases.length})</div>
              ${renderList(categoryIncreases, "up", currentSort)}
            </div>
          ` : ""}
          ${categoryDecreases.length ? `
            <div>
              <div style="font-size:11px; color:var(--down); font-weight:700; margin-bottom:6px;">▼ Decreased (${categoryDecreases.length})</div>
              ${renderList(categoryDecreases, "down", currentSort)}
            </div>
          ` : ""}
        </div>
      `
      : `<div class="empty" style="margin-top:20px;">No products in this category changed during this period.</div>`;

    const hagstofaHtml = await hagstofaCategoryHtml(name);

    modalContent.innerHTML = `
      <h2>${name}</h2>
      <div class="modal-meta">Product category · average price change since ${points.length ? fmtDateShort(points[0][0]) : "start"}</div>
      <div class="modal-price ${changeFromStart > 0 ? "up" : changeFromStart < 0 ? "down" : ""}">${changeFromStart != null ? `${changeFromStart > 0 ? "+" : ""}${fmtIndex(changeFromStart)}%` : "—"}</div>
      ${sparklineSvg(points)}
      <div class="modal-meta" style="margin-top:10px;">Average price change of all products in this category relative to the first snapshot — not an official index.</div>
      ${hagstofaHtml}
      ${productsHtml}
    `;
    wireSparklineHover(modalContent, (v) => {
      const pct = base ? ((v - base) / base) * 100 : 0;
      return `${pct > 0 ? "+" : ""}${fmtIndex(Math.round(pct * 10) / 10)}%`;
    });
    attachLineClicks(modalContent);
  }

  let categorySubindices = null;
  async function ensureCategorySubindicesLoaded() {
    if (categorySubindices === null) {
      try {
        const res = await fetch("data/cpi-categories.json");
        categorySubindices = res.ok ? await res.json() : {};
      } catch {
        categorySubindices = {};
      }
    }
    return categorySubindices;
  }
  async function hagstofaCategoryHtml(name) {
    const subs = await ensureCategorySubindicesLoaded();
    const c = subs[name];
    if (!c) return "";
    return `
      <div class="anova-box" style="margin-top:16px;">
        <strong>According to Statistics Iceland (official sub-index, ${fmtCpiMonth(c.month)}):</strong><br>
        ${fmtIndex(c.index)} points · monthly change ${fmtCpiPercent(c.monthChangePercent)} · yearly change ${fmtCpiPercent(c.yearChangePercent)}
      </div>
    `;
  }

  document.getElementById("modalClose").addEventListener("click", () => modalBackdrop.classList.remove("open"));
  modalBackdrop.addEventListener("click", (e) => {
    if (e.target === modalBackdrop) modalBackdrop.classList.remove("open");
  });

  // ---------- movers rendering ----------
  const CATEGORY_ICONS = {
    "Ávextir": '<circle cx="8" cy="9.3" r="5.2" fill="#FFE800" stroke="#2a2822" stroke-width="0.8"/> <ellipse cx="6" cy="7.5" rx="1.3" ry="0.7" fill="#ffffff" opacity="0.4"/> <path d="M8 4.3c0-1 .3-1.6 1-2.1" stroke="#2a2822" stroke-width="1.1" fill="none" stroke-linecap="round"/> <path d="M8.8 3c1.2-1.2 3-.2 2.4 1.3-.6 1.3-2.6.8-2.7-1.1z" fill="#2a2822"/>',
    "Grænmeti": '<path d="M9.3 4.2l-3.6 9.6a1 1 0 001.8.7l3.6-9.6z" fill="#FFE800" stroke="#2a2822" stroke-width="0.8"/> <path d="M9.2 4.4c-.8-1.4-.4-2.7-1.4-3.4 M8.7 3.2c-1.4-.2-1.8-1.4-3-1.4 M9.8 3.6c.6-1.4 2-1.6 2.2-2.6" stroke="#2a2822" stroke-width="1.1" fill="none" stroke-linecap="round"/>',
    "Tilbúnir réttir": '<path d="M3 8h10a5 5 0 01-10 0z" fill="#FFE800" stroke="#2a2822" stroke-width="0.8"/> <path d="M6 4.5c0-1 .8-1 .8-2M8 3.5c0-1 .8-1 .8-2M10 4.5c0-1 .8-1 .8-2" stroke="#2a2822" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.6"/>',
    "Fiskur": '<path d="M2 8c3-4 9-4 12 0-3 4-9 4-12 0z" fill="#FFE800" stroke="#2a2822" stroke-width="0.8"/> <circle cx="4.3" cy="7" r="0.7" fill="#2a2822"/> <path d="M14 8l2.2-2.2v4.4z" fill="#FFE800" stroke="#2a2822" stroke-width="0.8"/>',
    "Kjöt": '<path d="M6 3c3-1 6 2 5 5s-4 2-6 4c-1 1-3 1-3-1s2-2 3-3c-2-1-2-4 1-5z" fill="#FFE800" stroke="#2a2822" stroke-width="0.8"/>',
    "Frystivara": '<g stroke="#2a2822" stroke-width="1.3" stroke-linecap="round"> <path d="M8 1.5v13M2.8 4.75l10.4 6.5M2.8 11.25l10.4-6.5"/> </g> <g fill="#FFE800" stroke="#2a2822" stroke-width="0.6"><circle cx="8" cy="1.5" r="1"/><circle cx="8" cy="14.5" r="1"/></g>',
    "Á brauð": '<path d="M3 14V6a5 5 0 0110 0v8z" fill="#FFE800" stroke="#2a2822" stroke-width="0.8"/> <circle cx="8" cy="9.3" r="1.6" fill="#2a2822"/>',
    "Mjólkurvörur og egg": '<ellipse cx="6" cy="10.5" rx="3.5" ry="4.2" fill="#FFE800" stroke="#2a2822" stroke-width="0.8"/> <path d="M11 3h4l1 2v9h-5z" fill="#fff" stroke="#2a2822" stroke-width="0.7"/> <path d="M11 3l2.5 2L16 3" stroke="#2a2822" stroke-width="0.7" fill="none"/>',
    "Vegan": '<path d="M3 13c0-6 4-10 10-10 0 6-4 10-10 10z" fill="#FFE800" stroke="#2a2822" stroke-width="0.8"/> <path d="M3 13c3-3 5-5 10-10" stroke="#2a2822" stroke-width="1" fill="none"/>',
    "Morgunmatur og heilsubót": '<path d="M2 8h12a6 6 0 01-12 0z" fill="#FFE800" stroke="#2a2822" stroke-width="0.8"/> <path d="M8 8V2" stroke="#2a2822" stroke-width="1.3" stroke-linecap="round"/> <circle cx="8" cy="2" r="1.1" fill="#2a2822"/>',

    "Laugardags": '<path d="M8 1l1.8 4.6L15 6l-3.7 3.2L12.4 15 8 12.3 3.6 15l1.1-5.8L1 6l5.2-.4z" fill="#FFE800" stroke="#2a2822" stroke-width="0.8"/>',

  };

  function categoryIconSvg(name) {
    const inner = CATEGORY_ICONS[name];
    if (!inner) return "";
    return `<svg class="cat-icon" viewBox="0 0 16 16" width="20" height="20" aria-hidden="true">${inner}</svg>`;
  }

  function metaLine(it) {
    const catHtml = it.category ? `<span class="cat-link" data-category="${it.category.replace(/"/g,'&quot;')}">${it.category}</span>` : "";
    return [catHtml, it.brand].filter(Boolean).join(" · ");
  }

  function renderList(items, direction, sortMode) {
    if (!items || items.length === 0) return '<div class="empty">No changes</div>';
    return items.map((it) => `
      <div class="line ${direction}" data-sku="${it.sku}" data-name="${it.name.replace(/"/g,'&quot;')}" data-brand="${(it.brand||"").replace(/"/g,'&quot;')}" data-category="${(it.category||"").replace(/"/g,'&quot;')}">
        <div class="line-icon">${categoryIconSvg(it.category)}</div>
        <div class="name">${it.name}</div>
        <div class="percent">${sortMode === "amount" ? fmtAmount(it.amount, it.unit) : fmtPercent(it.percent)}</div>
        <div class="meta">${metaLine(it)}</div>
        <div class="prices">${fmtISKUnit(it.priceBefore, it.unit)} → ${fmtISKUnit(it.priceAfter, it.unit)}</div>
      </div>
    `).join("");
  }

  // Shows the first 4 movers; the rest render hidden and are revealed by
  // a single shared "see more" button below both columns.
  const MOVERS_PREVIEW_COUNT = 4;
  function renderMoversSection(items, direction, sortMode) {
    if (!items || items.length === 0) return renderList(items, direction, sortMode);
    const visible = items.slice(0, MOVERS_PREVIEW_COUNT);
    const extra = items.slice(MOVERS_PREVIEW_COUNT);
    if (extra.length === 0) return `<div class="movers-block">${renderList(visible, direction, sortMode)}</div>`;
    return `
      <div class="movers-block">
        <div class="movers-visible">${renderList(visible, direction, sortMode)}</div>
        <div class="movers-extra" hidden>${renderList(extra, direction, sortMode)}</div>
      </div>
    `;
  }

  function attachSeeMoreToggle(root, totalExtra) {
    const btn = root.querySelector(".see-more-btn");
    if (!btn) return;
    btn.addEventListener("click", () => {
      const extras = root.querySelectorAll(".movers-extra");
      const collapsed = extras.length > 0 && extras[0].hasAttribute("hidden");
      extras.forEach((extra) => {
        if (collapsed) extra.removeAttribute("hidden");
        else extra.setAttribute("hidden", "");
      });
      btn.textContent = collapsed ? "Show fewer" : `See more (${totalExtra})`;
    });
  }

  function renderExtreme(item) {
    if (!item) return '<div class="empty">No data</div>';
    return `
      <div class="line" data-sku="${item.sku}" data-name="${item.name.replace(/"/g,'&quot;')}" data-brand="${(item.brand||"").replace(/"/g,'&quot;')}" data-category="${(item.category||"").replace(/"/g,'&quot;')}">
        <div class="line-icon">${categoryIconSvg(item.category)}</div>
        <div class="name">${item.name}</div>
        <div class="percent">${fmtISK(item.price)}</div>
        <div class="meta">${metaLine(item)}</div>
      </div>
    `;
  }

  function renderExtremeList(items) {
    if (!items || items.length === 0) return '<div class="empty">No data</div>';
    return items.map(renderExtreme).join("");
  }

  function renderVolatile(items) {
    if (!items || items.length === 0) {
      return '<div class="empty">Not enough data yet — coming in a few days</div>';
    }
    return items.map((it) => `
      <div class="line" data-sku="${it.sku}" data-name="${it.name.replace(/"/g,'&quot;')}" data-brand="${(it.brand||"").replace(/"/g,'&quot;')}" data-category="${(it.category||"").replace(/"/g,'&quot;')}">
        <div class="line-icon">${categoryIconSvg(it.category)}</div>
        <div class="name">${it.name}</div>
        <div class="percent" style="color:var(--star);">${it.changes}×</div>
        <div class="meta">${metaLine(it)}</div>
        <div class="prices">over ${it.days} days</div>
      </div>
    `).join("");
  }

  function attachLineClicks(root) {
    root.querySelectorAll(".line[data-sku]").forEach((el) => {
      el.addEventListener("click", () => openProduct(el.dataset.sku, el.dataset.name, el.dataset.brand, el.dataset.category));
    });
    root.querySelectorAll(".cat-link").forEach((el) => {
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        openCategory(el.dataset.category);
      });
    });
  }

  let currentView = "overview"; // "overview" | "extremes"
  const viewTabsEl = document.getElementById("viewTabs");
  viewTabsEl.querySelectorAll(".view-tab").forEach((btn) => {
    btn.addEventListener("click", () => {
      if (btn.dataset.view === currentView) return;
      currentView = btn.dataset.view;
      viewTabsEl.querySelectorAll(".view-tab").forEach((b) => b.classList.toggle("active", b === btn));
      rangeTabsEl.style.display = currentView === "overview" ? "" : "none";
      sortTabsEl.style.display = currentView === "overview" ? "" : "none";
      renderRangeView();
    });
  });

  let currentRange = "daily";
  const rangeTabsEl = document.getElementById("rangeTabs");
  rangeTabsEl.querySelectorAll(".range-tab").forEach((btn) => {
    btn.addEventListener("click", () => {
      if (btn.dataset.range === currentRange) return;
      currentRange = btn.dataset.range;
      rangeTabsEl.querySelectorAll(".range-tab").forEach((b) => b.classList.toggle("active", b === btn));
      renderRangeView();
    });
  });

  let currentSort = "percent"; // "percent" | "amount"
  const sortTabsEl = document.getElementById("sortTabs");
  sortTabsEl.querySelectorAll(".sort-tab").forEach((btn) => {
    btn.addEventListener("click", () => {
      if (btn.dataset.sort === currentSort) return;
      currentSort = btn.dataset.sort;
      sortTabsEl.querySelectorAll(".sort-tab").forEach((b) => b.classList.toggle("active", b === btn));
      renderRangeView();
    });
  });

  function rangeData(movers, range) {
    if (range === "weekly") return movers.weekly || { comparedTo: null, increasedCount: 0, decreasedCount: 0, topIncreases: [], topDecreases: [], topIncreasesByAmount: [], topDecreasesByAmount: [] };
    return movers;
  }

  const shrinkAlertEl = document.getElementById("shrinkAlert");

  function renderShrinkAlert(alerts) {
    if (!alerts || alerts.length === 0) { shrinkAlertEl.hidden = true; return; }
    const items = alerts.slice(0, 8).map((a) =>
      `<li>${a.name}${a.brand ? " · " + a.brand : ""} — per-kg price up ${fmtPercent(a.percent)} (${fmtISK(a.price)} unchanged)</li>`
    ).join("");
    shrinkAlertEl.innerHTML = `
      <strong>⚠ Possible shrinkflation</strong>
      The sticker price is unchanged, but the per-kilo price rose anyway — meaning the package itself has likely gotten smaller:
      <ul>${items}</ul>
      ${alerts.length > 8 ? `<div style="margin-top:4px;">...and ${alerts.length - 8} more.</div>` : ""}
    `;
    shrinkAlertEl.hidden = false;
  }

  function renderMovers(movers) {
    currentMovers = movers;
    dateLabelEl.textContent = fmtDateLong(movers.date);
    renderShrinkAlert(movers.shrinkflationAlerts);
    renderRangeView();
  }

  function renderRangeView() {
    if (!currentMovers) return;
    renderCategoryBreakdown(rangeData(currentMovers, currentRange));
    if (currentView === "extremes") { renderExtremesView(); return; }
    if (currentView === "stats") { renderStatsView(); return; }
    renderOverviewView();
  }

  function renderExtremesView() {
    const movers = currentMovers;
    contentEl.innerHTML = `
      <div class="two-col-grid">
        <section>
          <div class="section-label">5 cheapest products</div>
          ${renderExtremeList(movers.cheapest)}
        </section>
        <section>
          <div class="section-label">5 most expensive products</div>
          ${renderExtremeList(movers.mostExpensive)}
        </section>
      </div>
      <div class="section-label">★ Most volatile products</div>
      ${renderVolatile(movers.mostVolatile)}
    `;
    attachLineClicks(contentEl);
  }

  function renderOverviewView() {
    const movers = currentMovers;
    const rd = rangeData(movers, currentRange);

    if (currentRange === "weekly" && !rd.comparedTo) {
      contentEl.innerHTML = `
        <div class="status">Not enough data yet to compare with last week — coming in a few days.</div>
      `;
      return;
    }

    const upList = currentSort === "amount" ? rd.topIncreasesByAmount : rd.topIncreases;
    const downList = currentSort === "amount" ? rd.topDecreasesByAmount : rd.topDecreases;
    const totalExtra = Math.max((upList?.length || 0) - MOVERS_PREVIEW_COUNT, 0) + Math.max((downList?.length || 0) - MOVERS_PREVIEW_COUNT, 0);

    contentEl.innerHTML = `
      <div class="two-col-grid">
        <section class="col-up">
          <div class="section-label up">Biggest increases (${rd.increasedCount ?? 0})</div>
          ${renderMoversSection(upList, "up", currentSort)}
        </section>
        <section class="col-down">
          <div class="section-label down">Biggest decreases (${rd.decreasedCount ?? 0})</div>
          ${renderMoversSection(downList, "down", currentSort)}
        </section>
      </div>
      ${totalExtra > 0 ? `<button type="button" class="see-more-btn">See more (${totalExtra})</button>` : ""}
    `;
    attachLineClicks(contentEl);
    attachSeeMoreToggle(contentEl, totalExtra);
  }

  async function loadDate(date) {
    contentEl.innerHTML = '<div class="status">Loading data…</div>';
    try {
      const res = await fetch(`data/movers/${date}.json`);
      if (!res.ok) throw new Error("not found");
      renderMovers(await res.json());
    } catch (e) {
      contentEl.innerHTML = '<div class="status">No data found for this day.</div>';
    }
  }

  // ---------- calendar date picker ----------
  const MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  let availableDates = [];
  let selectedDate = null;
  let viewYear = 0, viewMonth = 0; // viewMonth is 0-indexed

  function openDatePanel() {
    dateSelectEl.panel.hidden = false;
    dateSelectEl.toggle.setAttribute("aria-expanded", "true");
  }
  function closeDatePanel() {
    dateSelectEl.panel.hidden = true;
    dateSelectEl.toggle.setAttribute("aria-expanded", "false");
  }
  dateSelectEl.toggle.addEventListener("click", (e) => {
    e.stopPropagation();
    dateSelectEl.panel.hidden ? openDatePanel() : closeDatePanel();
  });
  document.addEventListener("click", (e) => {
    if (!dateSelectEl.el.contains(e.target)) closeDatePanel();
  });
  dateSelectEl.prevBtn.addEventListener("click", () => shiftMonth(-1));
  dateSelectEl.nextBtn.addEventListener("click", () => shiftMonth(1));

  function shiftMonth(delta) {
    viewMonth += delta;
    if (viewMonth < 0) { viewMonth = 11; viewYear--; }
    if (viewMonth > 11) { viewMonth = 0; viewYear++; }
    renderCalendarGrid();
  }

  function renderCalendarGrid() {
    const first = new Date(viewYear, viewMonth, 1);
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    const startOffset = (first.getDay() + 6) % 7; // Monday-first

    dateSelectEl.monthLabel.textContent = `${MONTH_NAMES[viewMonth]} ${viewYear}`;

    const minDate = availableDates[0];
    const maxDate = availableDates[availableDates.length - 1];
    const minY = +minDate.slice(0, 4), minM = +minDate.slice(5, 7) - 1;
    const maxY = +maxDate.slice(0, 4), maxM = +maxDate.slice(5, 7) - 1;
    dateSelectEl.prevBtn.disabled = viewYear < minY || (viewYear === minY && viewMonth <= minM);
    dateSelectEl.nextBtn.disabled = viewYear > maxY || (viewYear === maxY && viewMonth >= maxM);

    let html = "";
    for (let i = 0; i < startOffset; i++) html += `<span class="empty-cell"></span>`;
    for (let day = 1; day <= daysInMonth; day++) {
      const dateStr = `${viewYear}-${String(viewMonth + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
      const hasData = availableDates.includes(dateStr);
      const isSelected = dateStr === selectedDate;
      html += `<button type="button" class="${hasData ? "has-data" : ""} ${isSelected ? "selected" : ""}" data-date="${dateStr}" ${hasData ? "" : "disabled"}>${day}</button>`;
    }
    dateSelectEl.grid.innerHTML = html;
    dateSelectEl.grid.querySelectorAll("button[data-date]:not([disabled])").forEach((btn) => {
      btn.addEventListener("click", () => {
        selectedDate = btn.dataset.date;
        loadDate(selectedDate);
        closeDatePanel();
        renderCalendarGrid();
      });
    });
  }

  function initDatePicker(dates) {
    availableDates = dates.slice().sort();
    selectedDate = availableDates[availableDates.length - 1];
    const [y, m] = selectedDate.split("-").map(Number);
    viewYear = y;
    viewMonth = m - 1;
    renderCalendarGrid();
  }

  const CPI_MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  function fmtCpiMonth(m) {
    // "2026M05" -> "May 2026"
    if (!m) return "";
    const [y, mm] = m.split("M");
    return `${CPI_MONTH_NAMES[Number(mm) - 1]} ${y}`;
  }
  function fmtCpiPercent(p) {
    if (p === null || p === undefined || Number.isNaN(p)) return "—";
    const sign = p > 0 ? "+" : "";
    return `${sign}${p.toFixed(1)}%`;
  }
  function cpiDirClass(p) {
    if (p === null || p === undefined) return "";
    return p > 0 ? "up" : p < 0 ? "down" : "";
  }

  const headerCpi = document.getElementById("headerCpi");

  async function loadCpi() {
    try {
      const res = await fetch("data/cpi.json");
      if (!res.ok) { headerCpi.style.display = "none"; return; }
      const cpi = await res.json();
      const overall = cpi.overall || cpi; // old flat format, in case a stale cached file is still around

      const item = (label, month, yearPct, monthPct, note) => `
        <span class="header-cpi-item" title="${fmtCpiMonth(month)}${note ? " — " + note : ""}">
          <span class="header-cpi-label">${label}</span>
          <span class="header-cpi-val ${cpiDirClass(yearPct)}">${fmtCpiPercent(yearPct)}</span> YoY
          ${monthPct != null ? `<span style="opacity:0.6;">(${fmtCpiPercent(monthPct)} MoM)</span>` : ""}
        </span>
      `;

      let html = item("CPI", overall.month, overall.yearChangePercent, overall.monthChangePercent);
      if (cpi.food) html += '<span class="header-cpi-divider" aria-hidden="true"></span>' + item("Food Price Index", cpi.food.month, cpi.food.yearChangePercent, cpi.food.monthChangePercent, "an independent index, not part of the CPI");

      headerCpi.innerHTML = html;
      headerCpi.style.display = "";
    } catch (e) {
      headerCpi.style.display = "none";
    }
  }

  const categoriesCard = document.getElementById("categoriesCard");
  const categoriesContent = document.getElementById("categoriesContent");

  let weekdayStatsCache = null;
  async function ensureWeekdayStatsLoaded() {
    if (weekdayStatsCache === null) {
      try {
        const res = await fetch("data/weekday-stats.json");
        weekdayStatsCache = res.ok ? await res.json() : {};
      } catch {
        weekdayStatsCache = {};
      }
    }
    return weekdayStatsCache;
  }

  async function renderStatsView() {
    contentEl.innerHTML = '<div class="status">Loading statistics…</div>';
    const stats = await ensureWeekdayStatsLoaded();
    const days = Object.entries(stats.days || {});
    if (days.length === 0) {
      contentEl.innerHTML = '<div class="status">No statistics yet.</div>';
      return;
    }

    const totalDays = days.reduce((s, [, d]) => s + d.days, 0);
    const totalUp = days.reduce((s, [, d]) => s + d.up, 0);
    const totalDown = days.reduce((s, [, d]) => s + d.down, 0);

    const fmtP = (p) => {
      if (p == null) return "—";
      const label = p < 0.001 ? "<0.001" : p.toFixed(3);
      return p < 0.05 ? `<strong style="color:var(--up);">${label}</strong>` : label;
    };

    const weekdayRows = days.map(([name, d]) => `
      <tr>
        <td>${WEEKDAY_NAMES_EN[name] || name}</td>
        <td>${d.days}</td>
        <td>${d.up}</td>
        <td>${d.down}</td>
        <td>${d.avgUpRate != null ? d.avgUpRate + "%" : "—"}</td>
        <td>${d.avgDownRate != null ? d.avgDownRate + "%" : "—"}</td>
        <td>${fmtP(d.pUp)}</td>
        <td>${fmtP(d.pDown)}</td>
      </tr>
    `).join("");

    contentEl.innerHTML = `
      <div class="stats-view">
      <div class="section-label">Summary</div>
      <table class="anova-table" style="margin-bottom:18px;">
        <tbody>
          <tr><td>Days in the dataset</td><td>${totalDays}</td></tr>
          <tr><td>Total increases recorded</td><td>${totalUp}</td></tr>
          <tr><td>Total decreases recorded</td><td>${totalDown}</td></tr>
        </tbody>
      </table>

      <div class="section-label">Increases and decreases by weekday</div>
      <p style="font-size:11px; color:var(--ink-faint); margin:-4px 0 10px;">
        The p-values compare each day against all other days combined (Welch's t-test) — red/bold means that day stands out significantly (p &lt; 0.05). Note: not corrected for multiple comparisons, so treat this as a signal rather than a final verdict.
      </p>
      <table class="anova-table" style="margin-bottom:8px;">
        <thead><tr><th>Weekday</th><th>Days</th><th>▲ count</th><th>▼ count</th><th>Mean ▲ rate</th><th>Mean ▼ rate</th><th>p (▲)</th><th>p (▼)</th></tr></thead>
        <tbody>${weekdayRows}</tbody>
      </table>

      <div class="section-label" style="margin-top:18px;">ANOVA tests</div>
      ${anovaHtml(stats.anovaUp, "increase rate")}
      ${anovaHtml(stats.anovaDown, "decrease rate")}
      </div>
    `;

    contentEl.querySelectorAll(".anova-more-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const detail = btn.nextElementSibling;
        const collapsed = detail.hasAttribute("hidden");
        if (collapsed) { detail.removeAttribute("hidden"); btn.textContent = "Hide detailed numbers ▲"; }
        else { detail.setAttribute("hidden", ""); btn.textContent = "Show detailed numbers ▼"; }
      });
    });
  }

  const WEEKDAY_NAMES_EN = {
    "Mánudagur": "Monday", "Þriðjudagur": "Tuesday", "Miðvikudagur": "Wednesday",
    "Fimmtudagur": "Thursday", "Föstudagur": "Friday", "Laugardagur": "Saturday", "Sunnudagur": "Sunday",
  };

  function anovaDetailTable(anova) {
    const rows = (anova.groupStats || []).map((g) =>
      `<tr><td>${WEEKDAY_NAMES_EN[g.weekday] || g.weekday}</td><td>${g.n}</td><td>${g.mean}%</td></tr>`
    ).join("");
    return `
      <button type="button" class="anova-more-btn">Show detailed numbers ▼</button>
      <div class="anova-detail" hidden>
        <table class="anova-table">
          <thead><tr><th>Weekday</th><th>n</th><th>Mean</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
        <table class="anova-table" style="margin-top:6px;">
          <tbody>
            <tr><td>Degrees of freedom (between/within)</td><td>${anova.df1} / ${anova.df2}</td></tr>
            <tr><td>Sum of squares between (SSB)</td><td>${anova.ssBetween}</td></tr>
            <tr><td>Sum of squares within (SSW)</td><td>${anova.ssWithin}</td></tr>
            <tr><td>Mean square between (MSB)</td><td>${anova.msBetween}</td></tr>
            <tr><td>Mean square within (MSW)</td><td>${anova.msWithin}</td></tr>
            <tr><td>Total observations (N)</td><td>${anova.n}</td></tr>
            <tr><td>Number of groups (k)</td><td>${anova.groups}</td></tr>
          </tbody>
        </table>
      </div>
    `;
  }

  function anovaHtml(anova, label) {
    if (!anova) {
      return `<div class="anova-box">
        <strong>ANOVA — ${label}:</strong> not enough data yet — needs at least two observations on the same weekday to compute within-group variance. This appears automatically as more weeks of data accumulate.
      </div>`;
    }
    if (anova.f == null) {
      const sig = anova.p < 0.05;
      return `<div class="anova-box">
        <strong>ANOVA — ${label}:</strong> no variance within groups (p = ${anova.p})<br>
        ${sig
          ? `Significant difference in ${label} by weekday.`
          : `No significant difference in ${label} by weekday.`}
        ${anovaDetailTable(anova)}
      </div>`;
    }
    const sig = anova.p < 0.05;
    return `<div class="anova-box">
      <strong>ANOVA — ${label}:</strong> F(${anova.df1}, ${anova.df2}) = ${anova.f}, p = ${anova.p < 0.001 ? "<0.001" : anova.p.toFixed(3)}<br>
      ${sig
        ? `Significant difference in ${label} by weekday (p < 0.05).`
        : `No significant difference in ${label} by weekday (p ≥ 0.05) — the difference observed could be due to chance.`}
      ${anovaDetailTable(anova)}
    </div>`;
  }

  function renderCategoryBreakdown(movers) {
    const counts = new Map(); // category -> { up, down }
    for (const it of movers.topIncreases || []) {
      const cat = it.category || "Uncategorized";
      const entry = counts.get(cat) || { up: 0, down: 0 };
      entry.up += 1;
      counts.set(cat, entry);
    }
    for (const it of movers.topDecreases || []) {
      const cat = it.category || "Uncategorized";
      const entry = counts.get(cat) || { up: 0, down: 0 };
      entry.down += 1;
      counts.set(cat, entry);
    }

    if (counts.size === 0) { categoriesCard.style.display = "none"; return; }

    const rows = [...counts.entries()].sort((a, b) => (b[1].up + b[1].down) - (a[1].up + a[1].down));
    categoriesCard.style.display = "";
    categoriesContent.innerHTML = rows.map(([name, { up, down }]) => `
      <div class="category-row">
        <span class="category-name category-link" data-category="${name.replace(/"/g,'&quot;')}">${name}</span>
        <span class="category-count up">${up > 0 ? `▲${up}` : ""}</span>
        <span class="category-count down">${down > 0 ? `▼${down}` : ""}</span>
      </div>
    `).join("");
    categoriesContent.querySelectorAll(".category-link").forEach((el) => {
      el.addEventListener("click", () => openCategory(el.dataset.category));
    });
  }

  // ---------- init ----------
  async function init() {
    try {
      const indexRes = await fetch("data/movers/index.json");
      const dates = indexRes.ok ? await indexRes.json() : [];

      if (dates.length === 0) {
        contentEl.innerHTML = '<div class="status">No data yet — the first run collects baseline prices; comparisons will appear the next day.</div>';
        return;
      }

      initDatePicker(dates);

      await loadDate(dates[dates.length - 1]);
    } catch (e) {
      contentEl.innerHTML = '<div class="status">Error fetching data.</div>';
    }
  }

  init();
  renderFavorites();
  loadCpi();
</script>
</body>
