<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="UTF-8">
<title>Ferilskrá - Þorsteinn</title>
<link rel="icon" type="image/png" href="kronan-emblem.png">
<style>
  html, body { margin: 0; height: 100%; }
  .split {
    display: flex;
    height: 100vh;
    width: 100vw;
  }
  .split > div {
    flex: 1 1 50%;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .split > div + div {
    border-left: 2px solid #FFE800;
  }
  .label {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 14px;
    background: #14120a;
    color: #FFE800;
  }
  iframe {
    flex: 1 1 auto;
    border: none;
    width: 100%;
  }
  @media (max-width: 760px) {
    .split { flex-direction: column; }
    .split > div + div { border-left: none; border-top: 2px solid #FFE800; }
  }
</style>
</head>
<body>
  <div class="split">
    <div>
      <div class="label">Ferilskráin</div>
      <iframe src="ferilskra.pdf" title="Ferilskrá"></iframe>
    </div>
    <div>
      <div class="label">Kynningarbréfið</div>
      <iframe src="kynningarbref.pdf" title="Kynningarbréf"></iframe>
    </div>
  </div>
</body>
</html>
