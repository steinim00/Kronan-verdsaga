<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Verðbreytingar — Krónan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f2efe6;
    --paper-edge: #e7e2d3;
    --ink: #2a2822;
    --ink-faint: #8a8574;
    --up: #a8351f;
    --down: #2f6f4e;
    --rule: #cfc9b4;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: #d8d3c2;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(0,0,0,0.03), transparent 60%),
      radial-gradient(circle at 80% 80%, rgba(0,0,0,0.03), transparent 60%);
    font-family: "JetBrains Mono", monospace;
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 48px 16px 96px;
  }

  .receipt {
    width: 100%;
    max-width: 460px;
    background: var(--paper);
    box-shadow: 0 20px 40px -20px rgba(0,0,0,0.35);
    padding: 32px 28px 40px;
    position: relative;
  }

  .receipt::before,
  .receipt::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    height: 14px;
    background:
      linear-gradient(135deg, var(--paper) 25%, transparent 25%) 0 0,
      linear-gradient(225deg, var(--paper) 25%, transparent 25%) 0 0;
    background-size: 16px 16px;
    background-color: transparent;
  }
  .receipt::before { top: -13px; background-color: #d8d3c2; }
  .receipt::after { bottom: -13px; transform: scaleY(-1); background-color: #d8d3c2; }

  header {
    text-align: center;
    margin-bottom: 20px;
  }

  .store {
    font-family: "Fraunces", serif;
    font-weight: 700;
    font-size: 28px;
    letter-spacing: 0.02em;
  }

  .subtitle {
    margin-top: 4px;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  .meta {
    margin-top: 14px;
    font-size: 11px;
    color: var(--ink-faint);
    display: flex;
    justify-content: space-between;
    border-top: 1px dashed var(--rule);
    border-bottom: 1px dashed var(--rule);
    padding: 8px 0;
  }

  select {
    font-family: inherit;
    font-size: 11px;
    background: transparent;
    border: none;
    color: var(--ink);
    text-decoration: underline;
    cursor: pointer;
  }

  .section-label {
    margin: 22px 0 10px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-label.up { color: var(--up); }
  .section-label.down { color: var(--down); }

  .section-label::after {
    content: "";
    flex: 1;
    border-top: 1px dashed var(--rule);
  }

  .line {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 2px 10px;
    padding: 8px 0;
    border-bottom: 1px dotted var(--rule);
    font-size: 13px;
  }
  .line:last-child { border-bottom: none; }

  .line .name {
    font-weight: 500;
    line-height: 1.3;
  }
  .line .sku {
    grid-column: 1;
    font-size: 10px;
    color: var(--ink-faint);
  }
  .line .prices {
    grid-column: 2;
    text-align: right;
    font-size: 10px;
    color: var(--ink-faint);
  }
  .line .percent {
    grid-column: 2;
    text-align: right;
    font-weight: 700;
    font-size: 15px;
  }
  .line.up .percent::before { content: "▲ "; }
  .line.down .percent::before { content: "▼ "; }
  .line.up .percent { color: var(--up); }
  .line.down .percent { color: var(--down); }

  .empty {
    font-size: 12px;
    color: var(--ink-faint);
    padding: 8px 0;
    font-style: italic;
  }

  footer {
    margin-top: 26px;
    padding-top: 14px;
    border-top: 1px dashed var(--rule);
    text-align: center;
    font-size: 10px;
    color: var(--ink-faint);
    letter-spacing: 0.08em;
  }

  .status {
    text-align: center;
    padding: 40px 0;
    font-size: 13px;
    color: var(--ink-faint);
  }
</style>
</head>
<body>
  <div class="receipt">
    <header>
      <div class="store">KRÓNAN</div>
      <div class="subtitle">Verðbreytingar dagsins</div>
    </header>

    <div class="meta">
      <span id="dateLabel">—</span>
      <select id="dateSelect" aria-label="Velja dagsetningu"></select>
    </div>

    <div id="content">
      <div class="status">Sæki gögn…</div>
    </div>

    <footer>flest vörunúmer · daglegt uppgjör</footer>
  </div>

<script>
  const contentEl = document.getElementById("content");
  const dateLabelEl = document.getElementById("dateLabel");
  const dateSelectEl = document.getElementById("dateSelect");

  function fmtISK(n) {
    return new Intl.NumberFormat("is-IS").format(n) + " kr";
  }

  function renderList(items, direction) {
    if (!items || items.length === 0) {
      return '<div class="empty">Engar breytingar</div>';
    }
    return items.map((it) => `
      <div class="line ${direction}">
        <div class="name">${it.name}</div>
        <div class="percent">${it.percent > 0 ? "+" : ""}${it.percent}%</div>
        <div class="sku">${it.sku}${it.brand ? " · " + it.brand : ""}</div>
        <div class="prices">${fmtISK(it.priceBefore)} → ${fmtISK(it.priceAfter)}</div>
      </div>
    `).join("");
  }

  function renderExtreme(item) {
    if (!item) return '<div class="empty">Engin gögn</div>';
    return `
      <div class="line">
        <div class="name">${item.name}</div>
        <div class="percent extreme">${new Intl.NumberFormat("is-IS").format(item.price)} kr</div>
        <div class="sku">${item.sku}${item.brand ? " · " + item.brand : ""}</div>
      </div>
    `;
  }

  function renderMovers(movers) {
    dateLabelEl.textContent = movers.date;
    contentEl.innerHTML = `
      <div class="section-label up">Mestu hækkanir</div>
      ${renderList(movers.topIncreases, "up")}
      <div class="section-label down">Mestu lækkanir</div>
      ${renderList(movers.topDecreases, "down")}
      <div class="section-label">Ódýrasta varan</div>
      ${renderExtreme(movers.cheapest)}
      <div class="section-label">Dýrasta varan</div>
      ${renderExtreme(movers.mostExpensive)}
    `;
  }

  async function loadDate(date) {
    contentEl.innerHTML = '<div class="status">Sæki gögn…</div>';
    try {
      const res = await fetch(`data/movers/${date}.json`);
      if (!res.ok) throw new Error("not found");
      renderMovers(await res.json());
    } catch (e) {
      contentEl.innerHTML = '<div class="status">Fann engin gögn fyrir þennan dag.</div>';
    }
  }

  async function init() {
    try {
      const indexRes = await fetch("data/movers/index.json");
      const dates = indexRes.ok ? await indexRes.json() : [];

      if (dates.length === 0) {
        contentEl.innerHTML = '<div class="status">Engin gögn ennþá — fyrsta keyrslan safnar grunnverði, samanburður birtist daginn eftir.</div>';
        return;
      }

      dateSelectEl.innerHTML = dates
        .slice()
        .reverse()
        .map((d) => `<option value="${d}">${d}</option>`)
        .join("");
      dateSelectEl.addEventListener("change", () => loadDate(dateSelectEl.value));

      await loadDate(dates[dates.length - 1]);
      dateSelectEl.value = dates[dates.length - 1];
    } catch (e) {
      contentEl.innerHTML = '<div class="status">Villa við að sækja gögn.</div>';
    }
  }

  init();
</script>
</body>
</html>
