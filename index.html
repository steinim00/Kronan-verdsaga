<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Verðbreytingar — Krónan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f5f0da;
    --paper-edge: #ecdfb2;
    --ink: #2a2822;
    --ink-faint: #8a8574;
    --up: #a8351f;
    --down: #2860a3;
    --rule: #cfc9b4;
    --star: #b8912f;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: #ddcf9a;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(0,0,0,0.03), transparent 60%),
      radial-gradient(circle at 80% 80%, rgba(0,0,0,0.03), transparent 60%);
    font-family: "JetBrains Mono", monospace;
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 16px 96px;
    gap: 20px;
  }

  .toolbar {
    width: 100%;
    max-width: 460px;
    position: relative;
  }

  .page {
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .page-main, .page-sidebar {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .search-input {
    width: 100%;
    font-family: inherit;
    font-size: 13px;
    padding: 10px 12px;
    border: 1px solid var(--rule);
    background: var(--paper);
    color: var(--ink);
  }
  .search-input::placeholder { color: var(--ink-faint); }

  .search-results {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    background: var(--paper);
    border: 1px solid var(--rule);
    max-height: 280px;
    overflow-y: auto;
    z-index: 20;
    box-shadow: 0 12px 24px -12px rgba(0,0,0,0.35);
  }
  .search-results:empty { display: none; }

  .search-result {
    padding: 8px 12px;
    font-size: 12px;
    border-bottom: 1px dotted var(--rule);
    cursor: pointer;
  }
  .search-result:hover { background: var(--paper-edge); }
  .search-result .sr-name { font-weight: 500; }
  .search-result .sr-meta { color: var(--ink-faint); font-size: 10px; }

  .receipt {
    width: 100%;
    max-width: 460px;
    background: var(--paper);
    box-shadow: 0 20px 40px -20px rgba(0,0,0,0.35);
    padding: 32px 28px 40px;
    position: relative;
  }

  .receipt::before,
  .receipt::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    height: 14px;
    background:
      linear-gradient(135deg, var(--paper) 25%, transparent 25%) 0 0,
      linear-gradient(225deg, var(--paper) 25%, transparent 25%) 0 0;
    background-size: 16px 16px;
    background-color: transparent;
  }
  .receipt::before { top: -13px; background-color: #ddcf9a; }
  .receipt::after { bottom: -13px; transform: scaleY(-1); background-color: #ddcf9a; }

  header { text-align: center; margin-bottom: 20px; }

  .store {
    font-family: "Fraunces", serif;
    font-weight: 700;
    font-size: 28px;
    letter-spacing: 0.02em;
  }

  .subtitle {
    margin-top: 4px;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  .meta {
    margin-top: 14px;
    font-size: 11px;
    color: var(--ink-faint);
    display: flex;
    justify-content: space-between;
    border-top: 1px dashed var(--rule);
    border-bottom: 1px dashed var(--rule);
    padding: 8px 0;
  }

  .date-picker { position: relative; }

  .date-picker-toggle {
    font-family: inherit;
    font-size: 11px;
    background: transparent;
    border: none;
    color: var(--ink);
    text-decoration: underline;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 0;
  }
  .date-picker-toggle .caret { font-size: 9px; text-decoration: none; }

  .date-picker-panel {
    position: absolute;
    top: calc(100% + 10px);
    right: 0;
    z-index: 20;
    width: 216px;
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 8px;
    box-shadow: 0 10px 28px rgba(0,0,0,0.18);
    padding: 12px;
  }
  .date-picker-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .date-picker-nav button {
    background: none;
    border: none;
    font-family: inherit;
    font-size: 15px;
    color: var(--ink);
    cursor: pointer;
    padding: 2px 8px;
    line-height: 1;
  }
  .date-picker-nav button:disabled { color: var(--ink-faint); opacity: 0.3; cursor: default; }
  .date-picker-weekdays, .date-picker-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
  }
  .date-picker-weekdays span {
    font-size: 9px;
    text-align: center;
    color: var(--ink-faint);
    padding-bottom: 4px;
  }
  .date-picker-grid button {
    font-family: inherit;
    font-size: 11px;
    background: none;
    border: none;
    border-radius: 4px;
    aspect-ratio: 1;
    cursor: pointer;
    color: var(--ink-faint);
  }
  .date-picker-grid button.has-data { color: var(--ink); cursor: pointer; }
  .date-picker-grid button:disabled { opacity: 0.3; cursor: default; }
  .date-picker-grid button.has-data:hover { background: rgba(0,0,0,0.07); }
  .date-picker-grid button.selected { background: var(--ink); color: var(--paper); font-weight: 700; }
  .date-picker-grid .empty-cell { visibility: hidden; }

  .section-label {
    margin: 22px 0 10px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-label.up { color: var(--up); }
  .section-label.down { color: var(--down); }
  .section-label::after { content: ""; flex: 1; border-top: 1px dashed var(--rule); }

  .line {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 2px 10px;
    padding: 8px 0;
    border-bottom: 1px dotted var(--rule);
    font-size: 13px;
    cursor: pointer;
  }
  .line:last-child { border-bottom: none; }
  .line:hover .name { text-decoration: underline; }

  .line .name { font-weight: 500; line-height: 1.3; }
  .line .badge {
    font-size: 9px;
    color: var(--star);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-left: 6px;
  }
  .line .meta { grid-column: 1; font-size: 10px; color: var(--ink-faint); }
  .line .prices { grid-column: 2; text-align: right; font-size: 10px; color: var(--ink-faint); }
  .line .percent { grid-column: 2; text-align: right; font-weight: 700; font-size: 15px; }
  .line.up .percent::before { content: "▲ "; }
  .line.down .percent::before { content: "▼ "; }
  .line.up .percent { color: var(--up); }
  .line.down .percent { color: var(--down); }

  .empty { font-size: 12px; color: var(--ink-faint); padding: 8px 0; font-style: italic; }

  .range-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 16px;
  }
  .range-tab {
    font-family: inherit;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    background: none;
    border: 1px solid var(--rule);
    border-radius: 999px;
    padding: 6px 14px;
    color: var(--ink-faint);
    cursor: pointer;
  }
  .range-tab:hover { color: var(--ink); }
  .range-tab.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  .see-more-btn {
    display: block;
    width: 100%;
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    background: none;
    border: none;
    border-top: 1px dashed var(--rule);
    color: var(--ink-faint);
    padding: 10px 0 4px;
    margin-top: 2px;
    cursor: pointer;
    text-align: center;
  }
  .see-more-btn:hover { color: var(--ink); }

  .col-up, .col-down {
    padding: 6px 10px;
    margin: 0 -10px;
    border-radius: 6px;
  }
  .col-up { background: rgba(168, 53, 31, 0.06); }
  .col-down { background: rgba(40, 96, 163, 0.06); }
  .col-up .line { border-bottom-color: rgba(168, 53, 31, 0.15); }
  .col-down .line { border-bottom-color: rgba(40, 96, 163, 0.15); }
  .col-up .name, .col-up .meta, .col-up .prices { color: var(--up); }
  .col-down .name, .col-down .meta, .col-down .prices { color: var(--down); }
  .col-up .meta, .col-up .prices { opacity: 0.75; }
  .col-down .meta, .col-down .prices { opacity: 0.75; }

  .cpi-index {
    font-size: 32px;
    font-weight: 700;
    line-height: 1.1;
    margin-top: 4px;
  }
  .cpi-index-unit {
    font-size: 12px;
    font-weight: 400;
    color: var(--ink-faint);
    margin-left: 6px;
  }
  .cpi-month { font-size: 11px; color: var(--ink-faint); margin-top: 2px; }
  .cpi-rows { margin-top: 14px; display: flex; flex-direction: column; gap: 6px; }
  .cpi-row {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    padding-top: 6px;
    border-top: 1px dotted var(--rule);
  }
  .cpi-row span:first-child { color: var(--ink-faint); }
  .cpi-row span:last-child.up { color: var(--up); font-weight: 700; }
  .cpi-row span:last-child.down { color: var(--down); font-weight: 700; }

  .category-row {
    display: grid;
    grid-template-columns: 1fr 32px 32px;
    align-items: baseline;
    gap: 4px;
    font-size: 12px;
    padding: 7px 0;
    border-bottom: 1px dotted var(--rule);
  }
  .category-row:last-child { border-bottom: none; }
  .category-row .category-name { color: var(--ink); }
  .category-row .category-count { white-space: nowrap; font-size: 11px; font-weight: 700; text-align: right; }
  .category-row .category-count.up { color: var(--up); }
  .category-row .category-count.down { color: var(--down); }

  footer {
    margin-top: 26px;
    padding-top: 14px;
    border-top: 1px dashed var(--rule);
    text-align: center;
    font-size: 10px;
    color: var(--ink-faint);
    letter-spacing: 0.08em;
  }

  .status { text-align: center; padding: 40px 0; font-size: 13px; color: var(--ink-faint); }

  /* Favorites */
  .fav-line { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px dotted var(--rule); font-size: 13px; }
  .fav-line .name { cursor: pointer; }
  .fav-line .name:hover { text-decoration: underline; }
  .fav-star-btn { background: none; border: none; cursor: pointer; font-size: 15px; color: var(--star); }

  /* Product detail modal */
  .modal-backdrop {
    display: none;
    position: fixed; inset: 0;
    background: rgba(20,18,14,0.55);
    z-index: 50;
    align-items: flex-start;
    justify-content: center;
    padding: 48px 16px;
    overflow-y: auto;
  }
  .modal-backdrop.open { display: flex; }

  .modal {
    background: var(--paper);
    max-width: 420px;
    width: 100%;
    padding: 24px;
    position: relative;
  }
  .modal-close {
    position: absolute; top: 10px; right: 14px;
    background: none; border: none; font-size: 18px; cursor: pointer; color: var(--ink-faint);
  }
  .modal h2 { font-family: "Fraunces", serif; font-size: 20px; margin: 0 0 2px; padding-right: 20px; }
  .modal .modal-meta { font-size: 11px; color: var(--ink-faint); margin-bottom: 14px; }
  .modal .modal-price { font-size: 24px; font-weight: 700; margin: 10px 0; }
  .modal .modal-badges { display: flex; gap: 8px; margin-bottom: 10px; }
  .modal .badge-tag {
    font-size: 9px; text-transform: uppercase; letter-spacing: 0.05em;
    border: 1px solid var(--star); color: var(--star); padding: 2px 6px;
  }
  .modal svg { width: 100%; height: 120px; margin: 12px 0; }
  .fav-toggle {
    font-family: inherit; font-size: 12px; padding: 8px 14px;
    border: 1px solid var(--star); background: transparent; color: var(--star);
    cursor: pointer; margin-top: 8px;
  }
  .fav-toggle.active { background: var(--star); color: var(--paper); }

  /* ---------- Desktop layout ---------- */
  .two-col-grid { display: block; }

  @media (min-width: 860px) {
    .page {
      max-width: 980px;
      display: grid;
      grid-template-columns: 1fr 300px;
      align-items: start;
      gap: 32px;
    }
    .page-main { max-width: none; }
    .page-sidebar { position: sticky; top: 32px; }
    .page-main .toolbar,
    .page-main .receipt {
      max-width: none;
    }
    .receipt { padding: 36px 44px 44px; }

    .two-col-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: 40px;
    }
    .two-col-grid > section:first-child { grid-column: 1; }
    .two-col-grid > section:last-child { grid-column: 2; }
  }
</style>
</head>
<body>

  <div class="page">
    <div class="page-main">
      <div class="toolbar">
        <input class="search-input" id="searchInput" placeholder="Leita að vöru (nafn eða vörunúmer)…" autocomplete="off" />
        <div class="search-results" id="searchResults"></div>
      </div>

      <div class="receipt">
        <header>
          <div class="store">KRÓNAN</div>
          <div class="subtitle">Verðbreytingar dagsins</div>
        </header>

        <div class="meta">
          <span id="dateLabel">—</span>
          <div class="date-picker" id="datePicker">
            <button type="button" class="date-picker-toggle" id="dateToggle" aria-haspopup="true" aria-expanded="false">
              dagatal <span class="caret">▾</span>
            </button>
            <div class="date-picker-panel" id="datePanel" hidden>
              <div class="date-picker-nav">
                <button type="button" id="prevMonthBtn" aria-label="Fyrri mánuður">‹</button>
                <span id="monthLabel"></span>
                <button type="button" id="nextMonthBtn" aria-label="Næsti mánuður">›</button>
              </div>
              <div class="date-picker-weekdays">
                <span>M</span><span>Þ</span><span>M</span><span>F</span><span>F</span><span>L</span><span>S</span>
              </div>
              <div class="date-picker-grid" id="dateGrid"></div>
            </div>
          </div>
        </div>

        <div class="range-tabs" id="rangeTabs">
          <button type="button" class="range-tab active" data-range="daily">Síðasta sólarhring</button>
          <button type="button" class="range-tab" data-range="weekly">Síðustu viku</button>
        </div>

        <div id="content"><div class="status">Sæki gögn…</div></div>

        <footer>flest vörunúmer · daglegt uppgjör</footer>
      </div>
    </div>

    <div class="page-sidebar">
      <div class="receipt" id="cpiCard" style="display:none;">
        <div class="section-label">Vísitala neysluverðs</div>
        <div id="cpiContent"></div>
      </div>

      <div class="receipt" id="categoriesCard" style="display:none;">
        <div class="section-label">Vöruflokkar í dag</div>
        <div id="categoriesContent"></div>
      </div>

      <div class="receipt" id="favoritesCard" style="display:none;">
        <div class="section-label">★ Mínar vörur</div>
        <div id="favoritesContent"></div>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <button class="modal-close" id="modalClose">✕</button>
      <div id="modalContent"></div>
    </div>
  </div>

<script>
  const contentEl = document.getElementById("content");
  const dateLabelEl = document.getElementById("dateLabel");
  const dateSelectEl = {
    el: document.getElementById("datePicker"),
    toggle: document.getElementById("dateToggle"),
    panel: document.getElementById("datePanel"),
    grid: document.getElementById("dateGrid"),
    monthLabel: document.getElementById("monthLabel"),
    prevBtn: document.getElementById("prevMonthBtn"),
    nextBtn: document.getElementById("nextMonthBtn"),
  };
  const searchInputEl = document.getElementById("searchInput");
  const searchResultsEl = document.getElementById("searchResults");
  const modalBackdrop = document.getElementById("modalBackdrop");
  const modalContent = document.getElementById("modalContent");
  const favoritesCard = document.getElementById("favoritesCard");
  const favoritesContent = document.getElementById("favoritesContent");

  let currentMovers = null;
  let productIndex = null; // loaded lazily on first search

  // ---------- formatting ----------
  function fmtISK(n) {
    return new Intl.NumberFormat("is-IS").format(n) + " kr";
  }
  // Shows the unit next to the price when it's not a plain per-item price
  // (e.g. "1.598 kr/kg" for weight-priced goods, just "399 kr" for stk).
  function fmtISKUnit(n, unit) {
    const base = new Intl.NumberFormat("is-IS").format(n) + " kr";
    if (!unit || unit.toLowerCase() === "stk") return base;
    return base + "/" + unit;
  }
  function fmtPercent(n) {
    const formatted = new Intl.NumberFormat("is-IS", { maximumFractionDigits: 2 }).format(Math.abs(n));
    return (n > 0 ? "+" : n < 0 ? "-" : "") + formatted + "%";
  }

  // ---------- favorites (localStorage) ----------
  const FAV_KEY = "kronan-verdsaga-favorites";
  function getFavorites() {
    try { return JSON.parse(localStorage.getItem(FAV_KEY)) || []; } catch { return []; }
  }
  function setFavorites(list) {
    localStorage.setItem(FAV_KEY, JSON.stringify(list));
  }
  function isFavorite(sku) {
    return getFavorites().some((f) => f.sku === sku);
  }
  function toggleFavorite(sku, name, brand) {
    const list = getFavorites();
    const idx = list.findIndex((f) => f.sku === sku);
    if (idx >= 0) list.splice(idx, 1);
    else list.push({ sku, name, brand });
    setFavorites(list);
    renderFavorites();
  }

  async function renderFavorites() {
    const favs = getFavorites();
    if (favs.length === 0) { favoritesCard.style.display = "none"; return; }
    favoritesCard.style.display = "";
    favoritesContent.innerHTML = '<div class="status" style="padding:12px 0;">Sæki verð…</div>';

    const rows = await Promise.all(favs.map(async (f) => {
      const hist = await fetchHistory(f.sku);
      const last = hist.h[hist.h.length - 1];
      const prev = hist.h[hist.h.length - 2];
      const price = last ? last[1] : null;
      let trend = "";
      if (last && prev && prev[1]) {
        const pct = ((last[1] - prev[1]) / prev[1]) * 100;
        if (pct > 0) trend = `<span style="color:var(--up)">▲ ${fmtPercent(pct)}</span>`;
        else if (pct < 0) trend = `<span style="color:var(--down)">▼ ${fmtPercent(pct)}</span>`;
      }
      return `
        <div class="fav-line">
          <span class="name" data-sku="${f.sku}" data-name="${f.name}" data-brand="${f.brand || ""}">${f.name}</span>
          <span>${price != null ? fmtISK(price) : "—"} ${trend}</span>
        </div>
      `;
    }));
    favoritesContent.innerHTML = rows.join("");
    favoritesContent.querySelectorAll(".name[data-sku]").forEach((el) => {
      el.addEventListener("click", () => openProduct(el.dataset.sku, el.dataset.name, el.dataset.brand));
    });
  }

  // ---------- data fetching ----------
  async function fetchHistory(sku) {
    try {
      const res = await fetch(`data/history/${sku}.json`);
      if (!res.ok) return { h: [] };
      return res.json();
    } catch {
      return { h: [] };
    }
  }

  async function ensureIndexLoaded() {
    if (productIndex) return productIndex;
    const res = await fetch("data/products-index.json");
    productIndex = res.ok ? await res.json() : [];
    return productIndex;
  }

  // ---------- search ----------
  let searchDebounce;
  searchInputEl.addEventListener("input", () => {
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(runSearch, 150);
  });

  async function runSearch() {
    const q = searchInputEl.value.trim().toLowerCase();
    if (q.length < 2) { searchResultsEl.innerHTML = ""; return; }
    const index = await ensureIndexLoaded();
    const matches = index
      .filter((p) => p.name.toLowerCase().includes(q) || p.sku.includes(q) || (p.brand && p.brand.toLowerCase().includes(q)))
      .slice(0, 20);

    if (matches.length === 0) {
      searchResultsEl.innerHTML = '<div class="search-result">Ekkert fannst</div>';
      return;
    }
    searchResultsEl.innerHTML = matches.map((p) => `
      <div class="search-result" data-sku="${p.sku}" data-name="${p.name.replace(/"/g, '&quot;')}" data-brand="${(p.brand||"").replace(/"/g, '&quot;')}">
        <div class="sr-name">${p.name}</div>
        <div class="sr-meta">${[p.categoryPath ? p.categoryPath.split("/")[0].trim() : null, p.brand].filter(Boolean).join(" · ")}</div>
      </div>
    `).join("");
    searchResultsEl.querySelectorAll(".search-result[data-sku]").forEach((el) => {
      el.addEventListener("click", () => {
        openProduct(el.dataset.sku, el.dataset.name, el.dataset.brand);
        searchResultsEl.innerHTML = "";
        searchInputEl.value = "";
      });
    });
  }

  document.addEventListener("click", (e) => {
    if (!e.target.closest(".toolbar")) searchResultsEl.innerHTML = "";
  });

  // ---------- product detail modal ----------
  function sparklineSvg(points) {
    if (points.length < 2) {
      return '<div class="empty">Ekki næg gögn fyrir línurit ennþá</div>';
    }
    const w = 380, h = 110, pad = 6;
    const prices = points.map((p) => p[1]);
    const min = Math.min(...prices), max = Math.max(...prices);
    const range = max - min || 1;
    const step = (w - pad * 2) / (points.length - 1);

    const coords = points.map((p, i) => {
      const x = pad + i * step;
      const y = h - pad - ((p[1] - min) / range) * (h - pad * 2);
      return [x, y];
    });
    const path = coords.map(([x, y], i) => (i === 0 ? `M${x},${y}` : `L${x},${y}`)).join(" ");
    const last = coords[coords.length - 1];

    return `
      <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
        <path d="${path}" fill="none" stroke="#2a2822" stroke-width="2" />
        <circle cx="${last[0]}" cy="${last[1]}" r="3" fill="#a8351f" />
      </svg>
      <div style="display:flex; justify-content:space-between; font-size:10px; color:var(--ink-faint);">
        <span>${points[0][0]}</span>
        <span>${points[points.length - 1][0]}</span>
      </div>
    `;
  }

  async function openProduct(sku, name, brand) {
    modalBackdrop.classList.add("open");
    modalContent.innerHTML = '<div class="status">Sæki verðsögu…</div>';

    const hist = await fetchHistory(sku);
    const points = hist.h; // [[date, price, pricePerKiloOrNull], ...]
    const prices = points.map((p) => p[1]);
    const currentPrice = prices[prices.length - 1];
    const low = prices.length ? Math.min(...prices) : null;
    const high = prices.length ? Math.max(...prices) : null;

    const fav = isFavorite(sku);

    modalContent.innerHTML = `
      <h2>${name}</h2>
      <div class="modal-meta">${sku}${brand ? " · " + brand : ""}</div>
      <div class="modal-price">${currentPrice != null ? fmtISK(currentPrice) : "—"}</div>
      <div class="modal-badges">
        ${currentPrice != null && currentPrice === low ? '<span class="badge-tag">Lægsta verð sem sést hefur</span>' : ""}
        ${currentPrice != null && currentPrice === high && low !== high ? '<span class="badge-tag">Hæsta verð sem sést hefur</span>' : ""}
      </div>
      ${sparklineSvg(points)}
      <button class="fav-toggle ${fav ? "active" : ""}" id="favToggleBtn">
        ${fav ? "★ Í eftirlæti — fjarlægja" : "☆ Bæta í eftirlæti"}
      </button>
    `;
    document.getElementById("favToggleBtn").addEventListener("click", () => {
      toggleFavorite(sku, name, brand);
      openProduct(sku, name, brand); // re-render to flip button state
    });
  }

  document.getElementById("modalClose").addEventListener("click", () => modalBackdrop.classList.remove("open"));
  modalBackdrop.addEventListener("click", (e) => {
    if (e.target === modalBackdrop) modalBackdrop.classList.remove("open");
  });

  // ---------- movers rendering ----------
  function badgeFor(item) {
    if (item.allTimeLow) return '<span class="badge">nýtt lágmark</span>';
    if (item.allTimeHigh) return '<span class="badge">nýtt hámark</span>';
    return "";
  }

  function metaLine(it) {
    return [it.category, it.brand].filter(Boolean).join(" · ");
  }

  function renderList(items, direction) {
    if (!items || items.length === 0) return '<div class="empty">Engar breytingar</div>';
    return items.map((it) => `
      <div class="line ${direction}" data-sku="${it.sku}" data-name="${it.name.replace(/"/g,'&quot;')}" data-brand="${(it.brand||"").replace(/"/g,'&quot;')}">
        <div class="name">${it.name}${badgeFor(it)}</div>
        <div class="percent">${fmtPercent(it.percent)}</div>
        <div class="meta">${metaLine(it)}</div>
        <div class="prices">${fmtISKUnit(it.priceBefore, it.unit)} → ${fmtISKUnit(it.priceAfter, it.unit)}</div>
      </div>
    `).join("");
  }

  // Shows the first 3 movers, and — if there are more — a "sjá fleiri"
  // toggle that reveals the rest without a fresh fetch.
  const MOVERS_PREVIEW_COUNT = 3;
  function renderMoversSection(items, direction) {
    if (!items || items.length === 0) return renderList(items, direction);
    const visible = items.slice(0, MOVERS_PREVIEW_COUNT);
    const extra = items.slice(MOVERS_PREVIEW_COUNT);
    if (extra.length === 0) return `<div class="movers-block">${renderList(visible, direction)}</div>`;
    return `
      <div class="movers-block">
        <div class="movers-visible">${renderList(visible, direction)}</div>
        <div class="movers-extra" hidden>${renderList(extra, direction)}</div>
        <button type="button" class="see-more-btn" data-count="${extra.length}">Sjá fleiri (${extra.length})</button>
      </div>
    `;
  }

  function attachSeeMoreToggles(root) {
    root.querySelectorAll(".see-more-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const block = btn.closest(".movers-block");
        const extra = block.querySelector(".movers-extra");
        const collapsed = extra.hasAttribute("hidden");
        if (collapsed) {
          extra.removeAttribute("hidden");
          btn.textContent = "Sýna færri";
        } else {
          extra.setAttribute("hidden", "");
          btn.textContent = `Sjá fleiri (${btn.dataset.count})`;
        }
      });
    });
  }

  function renderExtreme(item) {
    if (!item) return '<div class="empty">Engin gögn</div>';
    return `
      <div class="line" data-sku="${item.sku}" data-name="${item.name.replace(/"/g,'&quot;')}" data-brand="${(item.brand||"").replace(/"/g,'&quot;')}">
        <div class="name">${item.name}${badgeFor(item)}</div>
        <div class="percent">${fmtISK(item.price)}</div>
        <div class="meta">${metaLine(item)}</div>
      </div>
    `;
  }

  function renderVolatile(items) {
    if (!items || items.length === 0) {
      return '<div class="empty">Ekki nóg gögn ennþá — kemur eftir nokkra daga</div>';
    }
    return items.map((it) => `
      <div class="line" data-sku="${it.sku}" data-name="${it.name.replace(/"/g,'&quot;')}" data-brand="${(it.brand||"").replace(/"/g,'&quot;')}">
        <div class="name">${it.name}</div>
        <div class="percent" style="color:var(--star);">${it.changes}×</div>
        <div class="meta">${metaLine(it)}</div>
        <div class="prices">á ${it.days} dögum</div>
      </div>
    `).join("");
  }

  function attachLineClicks(root) {
    root.querySelectorAll(".line[data-sku]").forEach((el) => {
      el.addEventListener("click", () => openProduct(el.dataset.sku, el.dataset.name, el.dataset.brand));
    });
  }

  let currentRange = "daily";
  const rangeTabsEl = document.getElementById("rangeTabs");
  rangeTabsEl.querySelectorAll(".range-tab").forEach((btn) => {
    btn.addEventListener("click", () => {
      if (btn.dataset.range === currentRange) return;
      currentRange = btn.dataset.range;
      rangeTabsEl.querySelectorAll(".range-tab").forEach((b) => b.classList.toggle("active", b === btn));
      renderRangeView();
    });
  });

  function rangeData(movers, range) {
    if (range === "weekly") return movers.weekly || { comparedTo: null, increasedCount: 0, decreasedCount: 0, topIncreases: [], topDecreases: [] };
    return movers;
  }

  function renderMovers(movers) {
    currentMovers = movers;
    dateLabelEl.textContent = movers.date;
    renderRangeView();
  }

  function renderRangeView() {
    if (!currentMovers) return;
    const movers = currentMovers;
    const rd = rangeData(movers, currentRange);
    renderCategoryBreakdown(rd);

    if (currentRange === "weekly" && !rd.comparedTo) {
      contentEl.innerHTML = `
        <div class="status">Ekki nóg gögn ennþá til að bera saman við síðustu viku — kemur eftir nokkra daga.</div>
        <div class="section-label">Ódýrasta varan</div>
        ${renderExtreme(movers.cheapest)}
        <div class="section-label">Dýrasta varan</div>
        ${renderExtreme(movers.mostExpensive)}
        <div class="section-label">★ Óstöðugustu vörurnar</div>
        ${renderVolatile(movers.mostVolatile)}
      `;
      attachLineClicks(contentEl);
      return;
    }

    contentEl.innerHTML = `
      <div class="two-col-grid">
        <section class="col-up">
          <div class="section-label up">Mestu hækkanir (${rd.increasedCount ?? 0})</div>
          ${renderMoversSection(rd.topIncreases, "up")}
        </section>
        <section class="col-down">
          <div class="section-label down">Mestu lækkanir (${rd.decreasedCount ?? 0})</div>
          ${renderMoversSection(rd.topDecreases, "down")}
        </section>
      </div>
      <div class="two-col-grid">
        <section>
          <div class="section-label">Ódýrasta varan</div>
          ${renderExtreme(movers.cheapest)}
        </section>
        <section>
          <div class="section-label">Dýrasta varan</div>
          ${renderExtreme(movers.mostExpensive)}
        </section>
      </div>
      <div class="section-label">★ Óstöðugustu vörurnar</div>
      ${renderVolatile(movers.mostVolatile)}
    `;
    attachLineClicks(contentEl);
    attachSeeMoreToggles(contentEl);
  }

  async function loadDate(date) {
    contentEl.innerHTML = '<div class="status">Sæki gögn…</div>';
    try {
      const res = await fetch(`data/movers/${date}.json`);
      if (!res.ok) throw new Error("not found");
      renderMovers(await res.json());
    } catch (e) {
      contentEl.innerHTML = '<div class="status">Fann engin gögn fyrir þennan dag.</div>';
    }
  }

  // ---------- calendar date picker ----------
  const MONTH_NAMES = ["janúar","febrúar","mars","apríl","maí","júní","júlí","ágúst","september","október","nóvember","desember"];
  let availableDates = [];
  let selectedDate = null;
  let viewYear = 0, viewMonth = 0; // viewMonth is 0-indexed

  function openDatePanel() {
    dateSelectEl.panel.hidden = false;
    dateSelectEl.toggle.setAttribute("aria-expanded", "true");
  }
  function closeDatePanel() {
    dateSelectEl.panel.hidden = true;
    dateSelectEl.toggle.setAttribute("aria-expanded", "false");
  }
  dateSelectEl.toggle.addEventListener("click", (e) => {
    e.stopPropagation();
    dateSelectEl.panel.hidden ? openDatePanel() : closeDatePanel();
  });
  document.addEventListener("click", (e) => {
    if (!dateSelectEl.el.contains(e.target)) closeDatePanel();
  });
  dateSelectEl.prevBtn.addEventListener("click", () => shiftMonth(-1));
  dateSelectEl.nextBtn.addEventListener("click", () => shiftMonth(1));

  function shiftMonth(delta) {
    viewMonth += delta;
    if (viewMonth < 0) { viewMonth = 11; viewYear--; }
    if (viewMonth > 11) { viewMonth = 0; viewYear++; }
    renderCalendarGrid();
  }

  function renderCalendarGrid() {
    const first = new Date(viewYear, viewMonth, 1);
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    const startOffset = (first.getDay() + 6) % 7; // Monday-first

    dateSelectEl.monthLabel.textContent = `${MONTH_NAMES[viewMonth]} ${viewYear}`;

    const minDate = availableDates[0];
    const maxDate = availableDates[availableDates.length - 1];
    const minY = +minDate.slice(0, 4), minM = +minDate.slice(5, 7) - 1;
    const maxY = +maxDate.slice(0, 4), maxM = +maxDate.slice(5, 7) - 1;
    dateSelectEl.prevBtn.disabled = viewYear < minY || (viewYear === minY && viewMonth <= minM);
    dateSelectEl.nextBtn.disabled = viewYear > maxY || (viewYear === maxY && viewMonth >= maxM);

    let html = "";
    for (let i = 0; i < startOffset; i++) html += `<span class="empty-cell"></span>`;
    for (let day = 1; day <= daysInMonth; day++) {
      const dateStr = `${viewYear}-${String(viewMonth + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
      const hasData = availableDates.includes(dateStr);
      const isSelected = dateStr === selectedDate;
      html += `<button type="button" class="${hasData ? "has-data" : ""} ${isSelected ? "selected" : ""}" data-date="${dateStr}" ${hasData ? "" : "disabled"}>${day}</button>`;
    }
    dateSelectEl.grid.innerHTML = html;
    dateSelectEl.grid.querySelectorAll("button[data-date]:not([disabled])").forEach((btn) => {
      btn.addEventListener("click", () => {
        selectedDate = btn.dataset.date;
        loadDate(selectedDate);
        closeDatePanel();
        renderCalendarGrid();
      });
    });
  }

  function initDatePicker(dates) {
    availableDates = dates.slice().sort();
    selectedDate = availableDates[availableDates.length - 1];
    const [y, m] = selectedDate.split("-").map(Number);
    viewYear = y;
    viewMonth = m - 1;
    renderCalendarGrid();
  }

  const cpiCard = document.getElementById("cpiCard");
  const cpiContent = document.getElementById("cpiContent");
  const CPI_MONTH_NAMES = ["janúar","febrúar","mars","apríl","maí","júní","júlí","ágúst","september","október","nóvember","desember"];

  function fmtCpiMonth(m) {
    // "2026M05" -> "maí 2026"
    if (!m) return "";
    const [y, mm] = m.split("M");
    return `${CPI_MONTH_NAMES[Number(mm) - 1]} ${y}`;
  }
  function fmtCpiPercent(p) {
    if (p === null || p === undefined || Number.isNaN(p)) return "—";
    const sign = p > 0 ? "+" : "";
    return `${sign}${p.toFixed(1)}%`.replace(".", ",");
  }
  function cpiDirClass(p) {
    if (p === null || p === undefined) return "";
    return p > 0 ? "up" : p < 0 ? "down" : "";
  }

  async function loadCpi() {
    try {
      const res = await fetch("data/cpi.json");
      if (!res.ok) { cpiCard.style.display = "none"; return; }
      const cpi = await res.json();
      cpiCard.style.display = "";
      cpiContent.innerHTML = `
        <div class="cpi-index">${cpi.index ?? "—"}<span class="cpi-index-unit">stig</span></div>
        <div class="cpi-month">${fmtCpiMonth(cpi.month)}</div>
        <div class="cpi-rows">
          <div class="cpi-row">
            <span>Mánaðarbreyting</span>
            <span class="${cpiDirClass(cpi.monthChangePercent)}">${fmtCpiPercent(cpi.monthChangePercent)}</span>
          </div>
          <div class="cpi-row">
            <span>Ársbreyting</span>
            <span class="${cpiDirClass(cpi.yearChangePercent)}">${fmtCpiPercent(cpi.yearChangePercent)}</span>
          </div>
        </div>
      `;
    } catch (e) {
      cpiCard.style.display = "none";
    }
  }

  const categoriesCard = document.getElementById("categoriesCard");
  const categoriesContent = document.getElementById("categoriesContent");

  function renderCategoryBreakdown(movers) {
    const counts = new Map(); // category -> { up, down }
    for (const it of movers.topIncreases || []) {
      const cat = it.category || "Óflokkað";
      const entry = counts.get(cat) || { up: 0, down: 0 };
      entry.up += 1;
      counts.set(cat, entry);
    }
    for (const it of movers.topDecreases || []) {
      const cat = it.category || "Óflokkað";
      const entry = counts.get(cat) || { up: 0, down: 0 };
      entry.down += 1;
      counts.set(cat, entry);
    }

    if (counts.size === 0) { categoriesCard.style.display = "none"; return; }

    const rows = [...counts.entries()].sort((a, b) => (b[1].up + b[1].down) - (a[1].up + a[1].down));
    categoriesCard.style.display = "";
    categoriesContent.innerHTML = rows.map(([name, { up, down }]) => `
      <div class="category-row">
        <span class="category-name">${name}</span>
        <span class="category-count up">${up > 0 ? `▲${up}` : ""}</span>
        <span class="category-count down">${down > 0 ? `▼${down}` : ""}</span>
      </div>
    `).join("");
  }

  // ---------- init ----------
  async function init() {
    try {
      const indexRes = await fetch("data/movers/index.json");
      const dates = indexRes.ok ? await indexRes.json() : [];

      if (dates.length === 0) {
        contentEl.innerHTML = '<div class="status">Engin gögn ennþá — fyrsta keyrslan safnar grunnverði, samanburður birtist daginn eftir.</div>';
        return;
      }

      initDatePicker(dates);

      await loadDate(dates[dates.length - 1]);
    } catch (e) {
      contentEl.innerHTML = '<div class="status">Villa við að sækja gögn.</div>';
    }
  }

  init();
  renderFavorites();
  loadCpi();
</script>
</body>
</html>
