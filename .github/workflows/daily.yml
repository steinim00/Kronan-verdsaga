name: Daily price snapshot

on:
  schedule:
    # 06:00 UTC = 06:00 Iceland time (no DST in Iceland)
    - cron: "0 6 * * *"
  workflow_dispatch: {} # allows manual "Run workflow" button too

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sækja verð og reikna breytingar
        env:
          KRONAN_ACCESS_TOKEN: ${{ secrets.KRONAN_ACCESS_TOKEN }}
        run: node src/index.js

      - name: Commit ný gögn
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Verðmynd: $(date -u +%F)"

          # Ef eitthvað annað pushaði á main á meðan þessi keyrsla var í
          # gangi (t.d. handvirk breyting), reynum við að endurstilla ofan á
          # nýjustu útgáfu og reyna aftur í stað þess að klikka strax.
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "Push mistókst, reyni aftur ($i/3)..."
            sleep 5
          done
