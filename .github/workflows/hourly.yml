name: Hourly price check

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  hourly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Klukkutíma-athugun
        env:
          KRONAN_ACCESS_TOKEN: ${{ secrets.KRONAN_ACCESS_TOKEN }}
        run: node src/hourlySnapshot.js

      - name: Commit ný gögn
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/hourly/
          git diff --staged --quiet || git commit -m "Klukkutíma-athugun: $(date -u +'%F %H:%M')"

          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "Push mistókst, reyni aftur ($i/3)..."
            sleep 5
          done
